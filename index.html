<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>BMG — Sorties &amp; Équipement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --panel:#fff; --border:#000; --text:#000;
    --muted:#6b6b6b; --accent:#000; --accent2:#000; --danger:#000; --green:#5FAD56; --green-hover:#539F4A; --on-green:rgba(0,0,0,0.62);
  }
  *{box-sizing:border-box;}
  html{font-size:16px;}
  body{margin:0 auto; max-width:1100px; font-family:'Inter',Arial,sans-serif; font-weight:400; background:#fff; color:#000; padding:48px 40px; font-size:12pt; line-height:1.5;}
  h1,h3,h4,h5{margin:0;}
  h1{font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:60pt; line-height:1; letter-spacing:-0.02em; margin-bottom:8px;}
  h3{font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:24pt; line-height:1.1; margin-bottom:24px; display:inline-block; background:var(--green); padding:8px 18px;}
  h4{font-family:'Inter',Arial,sans-serif; font-weight:600; font-size:12pt; margin-bottom:4px;}
  h5{font-family:'Inter',Arial,sans-serif; font-weight:600; font-size:9pt; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin:16px 0 4px;}
  .sub{color:var(--muted); font-size:12pt; margin-bottom:8px;}
  .tagline{font-size:12pt; color:var(--muted); margin-bottom:40px;}
  .nav{display:flex; gap:32px; margin:48px 0 28px; flex-wrap:wrap;}
  .subnav{display:flex; gap:30px; margin:0 0 40px; padding-top:14px; border-top:1px solid #000; flex-wrap:wrap;}
  .subbtn{background:none; border:none; border-bottom:2px solid transparent; border-radius:0; padding:6px 0; font-family:'Inter',Arial,sans-serif; font-size:13pt; font-weight:500; color:var(--muted); cursor:pointer; letter-spacing:0;}
  .subbtn:hover{background:none; color:#000;}
  .subbtn.active{color:#000; border-bottom:2px solid #000;}
  .intro{color:var(--muted); font-size:11pt; margin:-12px 0 36px;}
  .navbtn{background:none; border:none; border-radius:0; padding:8px 18px; font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:24pt; color:var(--muted); cursor:pointer; letter-spacing:0;}
  .navbtn:hover{background:none; color:#000;}
  .navbtn.active{color:#000; background:var(--green);}
  .panel{margin-bottom:56px;}
  label{display:block; font-size:9pt; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:4px;}
  select, input[type=number], input[type=text], input[type=date]{width:100%; padding:8px 0; border:none; border-bottom:1px solid #000; border-radius:0; background:transparent; color:#000; font-family:'Inter',Arial,sans-serif; font-size:12pt; -webkit-appearance:none; appearance:none;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='black'/></svg>"); background-repeat:no-repeat; background-position:right 2px center; padding-right:20px; cursor:pointer;}
  select:focus, input:focus{outline:none; border-bottom:2px solid #000;}
  .grid{display:grid; gap:28px 32px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); align-items:end;}
  button{background:#000; color:#fff; border:1px solid #000; border-radius:0; padding:10px 20px; font-family:'Inter',Arial,sans-serif; font-size:10pt; font-weight:500; letter-spacing:0.04em; cursor:pointer;}
  button:hover{background:#fff; color:#000;}
  button.secondary{background:transparent; color:#000; border:none; padding:0; text-decoration:underline; font-weight:400;}
  button.secondary:hover{background:transparent;}
  button.small{padding:6px 12px; font-size:9pt;}
  button.secondary.small{padding:0;}
  .btnrow{display:flex; gap:24px; margin-bottom:24px; flex-wrap:wrap; align-items:baseline;}
  .btnrow h3{margin-bottom:0;}
  .weightbar{display:flex; align-items:baseline; gap:32px; flex-wrap:wrap; background:var(--green); padding:20px 22px;}
  .weightbar .big{font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:40pt; line-height:1;}
  .weightbar .label, .weightbar .note{font-size:9pt; text-transform:uppercase; letter-spacing:0.08em; color:var(--on-green);}
  .cats{display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
  .cat, .recap-card, .sortie-card{background:var(--green); padding:20px 22px;}
  .cat .subcat-label, .recap-card .subcat-label, .cat .note, .recap-card .note, .sortie-meta{color:var(--on-green);}
  .cat .lnk, .cat .empty, .recap-card .empty{color:#000;}
  .cat h4, .recap-card h4, .sortie-card h4{font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:18pt; line-height:1.15; margin-bottom:8px;}
  .recap-card h4{display:flex; justify-content:space-between; align-items:baseline;}
  .item-row{font-size:12pt; padding:5px 0; display:flex; justify-content:space-between; gap:12px;}
  .subcat-label{display:block; font-size:9pt; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin:24px 0 4px;}
  .note{display:block; font-size:10pt; color:var(--muted);}
  .lnk{font-size:10pt; color:var(--muted); cursor:pointer; text-decoration:underline; margin-left:14px;}
  .empty{color:var(--muted); font-size:12pt; padding:4px 0;}
  .warn{border-left:3px solid #000; padding:4px 0 4px 14px; margin:16px 0; font-size:11pt;}
  .status{font-size:10pt; color:var(--muted); margin-top:16px;}
  .sortie-card{margin-bottom:12px; cursor:pointer;}
  .sortie-card:hover{background:var(--green-hover);}
  .sortie-meta{font-size:11pt;}
  .participants-list{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;}
  .part-chip{padding:6px 14px; border:1px solid #000; font-size:11pt; cursor:pointer; background:#fff; color:#000;}
  .part-chip.present{background:var(--green); color:#000;}
  .recap-card{margin-bottom:16px;}
  .collectif-row{display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12pt; padding:6px 0;}
  .repas-day{margin-bottom:16px;}
  .repas-item{font-size:12pt; display:flex; justify-content:space-between; gap:12px; padding:3px 0;}
  select.mini{width:auto; font-size:11pt; padding-top:4px; padding-bottom:4px;}
  @media (max-width: 480px){
    body{padding:24px 18px;}
    h1{font-size:40pt;}
    h3{font-size:20pt;}
    .navbtn{font-size:16pt; padding:6px 12px;}
    h3{padding:6px 12px;}
    .nav{gap:20px; margin:32px 0 20px;}
    .subnav{gap:20px;}
    .subbtn{font-size:12pt;}
    .grid, .cats{grid-template-columns:1fr;}
    .weightbar .big{font-size:30pt;}
  }
</style>
</head>
<body>

<h1>BMG</h1>
<div class="tagline">Sorties &amp; équipement</div>
<div class="sub" id="whoami-status">Chargement...</div>
<div class="sub" id="switch-user-row" style="display:none;">
  <span id="current-user-label" style="font-weight:600;"></span> — <a href="#" onclick="showIdentityPanel(); return false;" style="color:#000;">changer d'identité</a>
</div>

<div id="app" style="display:none;">

<div class="panel" id="identity-panel">
  <div class="grid">
    <div><label>Qui es-tu ?</label><select id="who-select"></select></div>
    <div><button onclick="setIdentity()">Valider</button></div>
  </div>
</div>

<div class="nav" id="nav-space">
  <button class="navbtn active" data-space="equipement" onclick="setSpace('equipement')">Mon équipement</button>
  <button class="navbtn" data-space="sorties" onclick="setSpace('sorties')">Sorties du club</button>
</div>
<div class="subnav" id="subnav" style="display:none;">
  <button class="subbtn" data-view="catalogue" onclick="setView('catalogue')">Idées de sorties</button>
  <button class="subbtn active" data-view="sorties" onclick="setView('sorties')">Planifier une sortie</button>
  <button class="subbtn" data-view="bilan" onclick="setView('bilan')">Bilan</button>
</div>

<div id="content"></div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwJ2LjB2yPjuYXj6J4Hw9i4VOFTgqNavBUI-eZlNErN7J6uspReUCfxo2h2z-4wQxwD/exec';
const SUBCATS = {
  couchage: ['Tente','Matelas','Duvet','Bonus'],
  vetements: ['Couche protectrice','Couche isolante','Sous-couche chaude','Couche transpirante','Pantalons et shorts','Extrémités'],
  equipements: ['Cuisine','Survie','Hydratation','Hygiène et nuit','Sac']
};
const TECH_POIDS = {
  'Crampons (paire)': 900, 'Piolet': 450, 'Piolet ou bâtons renforcés': 500,
  'Casque alpi': 350, 'Baudrier': 400,
  "Corde d'encordement (partagée, ~60m/9mm)": 2000, 'Broches à glace (kit)': 300,
  'DVA': 200, 'Pelle à neige': 500, 'Sonde avalanche': 250,
  'Raquettes à neige (paire)': 1800, 'Bâtons (paire)': 500, 'Guêtres': 250,
  'Casque vélo': 250, 'Kit de réparation / crevaison': 400,
  'Matériel pêche / vêtements étanches': 800, 'GPS (si pas de smartphone fiable)': 150,
};
const TECH_COLLECTIF = ["Corde d'encordement (partagée, ~60m/9mm)", 'Broches à glace (kit)'];

const SAISONS = ['Été','Automne','Hiver','Printemps','Toutes saisons'];
const TYPES = ['Randonnée','Trek','Bivouac','Alpinisme','Trail','Course à pied','Cyclisme','VTT','Découverte','Évènement','Évènement sportif'];
const NUITEES = ['Journée','Refuge','Bivouac','Cabane','Mixte'];
const TERRAINS = ['Sentier','Neige','Glacier','Rocher/Neige technique','Route','Eau'];
// Saison de la sortie (4 saisons) -> saison utilisée pour composer le kit (Chaude/Froide)
function saisonEquip(s){
  if(s === 'Chaude' || s === 'Froide') return s;
  return ({'Été':'Chaude','Printemps':'Chaude','Automne':'Froide','Hiver':'Froide'})[s] || 'Froide';
}
function esc(v){ return String(v === undefined || v === null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function opts(list, sel){ return list.map(o => `<option value="${esc(o)}" ${o===sel?'selected':''}>${esc(o)}</option>`).join(''); }
function isBureau(){ const m = membresCache.find(x => x.pseudo === currentUser); return !!m && m.role === 'bureau'; }
function canManage(s){ return isBureau() || (!!s && !!s.organisateur && s.organisateur === currentUser); }
function fmtNum(n){ return (n === '' || n === null || n === undefined) ? '' : Number(n).toLocaleString('fr-FR'); }
let catalogueCache = [];
let sortieFilter = 'prevue';
let bilanYear = null;
let currentUser = null;
let membresCache = [];
let sortiesCache = [];
let currentView = 'equipement';
let currentSortieId = null;
let currentSortie = null;
let kitCache = {};
let editTarget = null;

// ================= API =================
async function apiGet(action, params){
  params = params || {};
  const qs = Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const url = `${API_URL}?action=${action}${qs ? '&'+qs : ''}&_ts=${Date.now()}`;
  const res = await fetch(url, {cache:'no-store'});
  const data = await res.json();
  if(data && !Array.isArray(data) && data.error) throw new Error(data.error);
  return data;
}
function showLoadError(id, e){
  const el = document.getElementById(id);
  if(el) el.innerHTML = `<div class="warn">Impossible de charger les données (${esc(e && e.message ? e.message : e)}). Vérifie que le script est redéployé en « Nouvelle version » puis recharge la page (Ctrl+Maj+R).</div>`;
}
async function apiPost(action, body){
  body = body || {};
  const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, acteur: currentUser, ...body})});
  return await res.json();
}

// ================= Boot =================
async function boot(){
  try{ membresCache = await apiGet('membres'); }
  catch(e){ document.getElementById('whoami-status').textContent = 'Impossible de contacter le backend.'; return; }
  document.getElementById('who-select').innerHTML = membresCache.map(m => `<option value="${m.pseudo}">${m.pseudo}</option>`).join('');
  document.getElementById('whoami-status').textContent = 'Connecté à la base BMG.';
  document.getElementById('app').style.display = 'block';
}
function setIdentity(){
  currentUser = document.getElementById('who-select').value;
  document.getElementById('identity-panel').style.display = 'none';
  document.getElementById('whoami-status').textContent = '';
  document.getElementById('switch-user-row').style.display = 'block';
  document.getElementById('current-user-label').textContent = 'Connecté comme ' + currentUser;
  render();
}
function showIdentityPanel(){
  document.getElementById('who-select').value = currentUser;
  document.getElementById('identity-panel').style.display = 'block';
}
let lastClubView = 'sorties';
function setSpace(space){
  if(space === 'equipement') setView('equipement'); else setView(lastClubView);
}
function setView(view){
  currentView = view;
  currentSortieId = null;
  const club = view !== 'equipement';
  if(club) lastClubView = view;
  document.querySelectorAll('#nav-space .navbtn').forEach(b => b.classList.toggle('active', (b.dataset.space === 'sorties') === club));
  document.getElementById('subnav').style.display = club ? 'flex' : 'none';
  document.querySelectorAll('#subnav .subbtn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  render();
}

// ================= Rendu principal =================
function render(){
  const content = document.getElementById('content');
  if(currentView === 'equipement'){
    content.innerHTML = renderEquipementScreen();
    updateSubcatOptions();
    loadInventaire();
  } else if(currentView === 'catalogue'){
    content.innerHTML = renderCatalogueScreen();
    loadCatalogue();
  } else if(currentView === 'bilan'){
    content.innerHTML = renderBilanScreen();
    loadBilan();
  } else if(currentView === 'sorties' && !currentSortieId){
    content.innerHTML = renderSortiesListScreen();
    loadSorties();
  } else if(currentView === 'sorties' && currentSortieId){
    content.innerHTML = renderSortieDetailScreen();
    openSortieData();
  }
}

// ================= ÉCRAN ÉQUIPEMENT =================
function renderEquipementScreen(){
  return `
  <div class="intro">Ton matériel personnel. Il sert à composer ton sac pour chaque sortie du club.</div>
  <div class="panel">
    <h3>Ajouter / modifier un objet</h3>
    <div class="grid" style="margin-bottom:14px;">
      <div><label>Catégorie</label>
        <select id="inv_cat" onchange="updateSubcatOptions()">
          <option value="couchage">Couchage</option>
          <option value="vetements">Vêtements</option>
          <option value="equipements">Équipements</option>
        </select>
      </div>
      <div><label>Sous-catégorie</label><select id="inv_subcat"></select></div>
      <div><label>Nom de l'objet</label><input type="text" id="inv_nom"></div>
      <div><label>Saison</label>
        <select id="inv_saison"><option value="Chaude">Chaude</option><option value="Froide">Froide</option><option value="Multi">Multi</option></select>
      </div>
      <div><label>Confort</label>
        <select id="inv_confort"><option value="Sommaire">Sommaire</option><option value="Confortable" selected>Confortable</option><option value="Luxe">Luxe</option><option value="Indispensable">Indispensable</option></select>
      </div>
      <div><label>Poids (g)</label><input type="number" id="inv_poids" min="0"></div>
      <div><button id="inv_submit_btn" onclick="addInvItem()">+ Ajouter</button></div>
      <div><button id="inv_cancel_btn" class="secondary" onclick="cancelEditInv()" style="display:none;">Annuler</button></div>
    </div>
    <div class="status" id="inv_status"></div>
  </div>
  <div class="panel">
    <div class="btnrow"><h3 style="margin:0;">Mes objets</h3><button class="secondary small" onclick="loadInventaire()">Actualiser</button></div>
    <div id="inv_list" class="cats"></div>
  </div>`;
}

function updateSubcatOptions(){
  const sel = document.getElementById('inv_cat');
  if(!sel) return;
  const cat = sel.value;
  document.getElementById('inv_subcat').innerHTML = SUBCATS[cat].map(s => `<option value="${s}">${s}</option>`).join('');
}

function catalogFromItems(items){
  const cat = {couchage:{}, vetements:{}, equipements:{}};
  for(const c of Object.keys(SUBCATS)) for(const s of SUBCATS[c]) cat[c][s] = [];
  items.forEach(it => {
    if(cat[it.categorie] && cat[it.categorie][it.sous_categorie]){
      cat[it.categorie][it.sous_categorie].push({nom: it.nom, saison: it.saison, confort: it.confort, poids: Number(it.poids_g)});
    }
  });
  return cat;
}

async function loadInventaire(){
  if(!currentUser || currentView !== 'equipement') return;
  const items = await apiGet('inventaire', {pseudo: currentUser});
  renderInventaireList(items);
}
function renderInventaireList(items){
  const catalog = catalogFromItems(items);
  const container = document.getElementById('inv_list');
  if(!container) return;
  container.innerHTML = '';
  const labels = {couchage:'Couchage', vetements:'Vêtements', equipements:'Équipements'};
  for(const cat of Object.keys(SUBCATS)){
    const div = document.createElement('div');
    div.className = 'cat';
    let html = `<h4>${labels[cat]}</h4>`;
    for(const sub of SUBCATS[cat]){
      const arr = catalog[cat][sub];
      html += `<div class="subcat-label">${sub}</div>`;
      if(!arr.length) html += `<div class="empty">— vide —</div>`;
      else arr.forEach(it => {
        const nomEsc = it.nom.replace(/'/g,"\\'");
        html += `<div class="item-row"><span>${it.nom} (${it.saison}, ${it.confort}, ${it.poids}g)</span>
          <span><span class="lnk" onclick="editInvItem('${cat}','${sub}','${nomEsc}','${it.saison}','${it.confort}',${it.poids})">modifier</span><span class="lnk" onclick="delInvItem('${cat}','${sub}','${nomEsc}',${it.poids})">supprimer</span></span></div>`;
      });
    }
    div.innerHTML = html;
    container.appendChild(div);
  }
  const statusEl = document.getElementById('inv_status');
  if(statusEl) statusEl.textContent = items.length + ' objet(s) dans ton inventaire.';
}

function editInvItem(cat, sub, nom, saison, confort, poids){
  editTarget = {cat, sub, nom, poids};
  document.getElementById('inv_cat').value = cat;
  updateSubcatOptions();
  document.getElementById('inv_subcat').value = sub;
  document.getElementById('inv_nom').value = nom;
  document.getElementById('inv_saison').value = saison;
  document.getElementById('inv_confort').value = confort;
  document.getElementById('inv_poids').value = poids;
  document.getElementById('inv_submit_btn').textContent = 'Enregistrer';
  document.getElementById('inv_cancel_btn').style.display = 'inline-block';
}
function cancelEditInv(){
  editTarget = null;
  document.getElementById('inv_nom').value = '';
  document.getElementById('inv_poids').value = '';
  document.getElementById('inv_submit_btn').textContent = '+ Ajouter';
  document.getElementById('inv_cancel_btn').style.display = 'none';
}
async function addInvItem(){
  const cat = document.getElementById('inv_cat').value;
  const sub = document.getElementById('inv_subcat').value;
  const nom = document.getElementById('inv_nom').value.trim();
  const saison = document.getElementById('inv_saison').value;
  const confort = document.getElementById('inv_confort').value;
  const poids = parseInt(document.getElementById('inv_poids').value);
  if(!nom || !poids) return;
  if(editTarget){
    await apiPost('inventaire_delete', {pseudo: currentUser, categorie: editTarget.cat, sous_categorie: editTarget.sub, nom: editTarget.nom, poids_g: editTarget.poids});
  }
  await apiPost('inventaire_add', {pseudo: currentUser, categorie: cat, sous_categorie: sub, nom, saison, confort, poids_g: poids});
  cancelEditInv();
  loadInventaire();
}
async function delInvItem(cat, sub, nom, poids){
  await apiPost('inventaire_delete', {pseudo: currentUser, categorie: cat, sous_categorie: sub, nom, poids_g: poids});
  loadInventaire();
}

// ================= ÉCRAN LISTE DES SORTIES =================
function renderSortiesListScreen(){
  return `
  <div class="panel">
    <h3>Planifier une sortie</h3>
    <div class="grid" style="margin-bottom:10px;">
      <div style="grid-column:1/-1;"><label>Partir d'une idée de sortie (optionnel)</label>
        <select id="s_cat" onchange="prefillFromCatalogue()"><option value="">— Sortie libre —</option></select></div>
      <div><label>Titre</label><input type="text" id="s_titre"></div>
      <div><label>Type d'activité</label><select id="s_activite">${opts(TYPES,'Randonnée')}</select></div>
      <div><label>Mode de nuitée</label><select id="s_nuitee">${opts(NUITEES,'Journée')}</select></div>
      <div><label>Terrain</label><select id="s_terrain">${opts(TERRAINS,'Sentier')}</select></div>
      <div><label>Saison</label><select id="s_saison">${opts(SAISONS,'Été')}</select></div>
      <div><label>Difficulté</label><select id="s_difficulte">${opts(['1','2','3','4','5'],'2')}</select></div>
      <div><label>Durée (j)</label><input type="number" id="s_duree" value="1" min="1"></div>
      <div><label>Distance (km)</label><input type="text" id="s_dist"></div>
      <div><label>D+ (m)</label><input type="text" id="s_dplus"></div>
      <div><label>Date</label><input type="date" id="s_date"></div>
      <div><button onclick="createSortie()">+ Planifier la sortie</button></div>
    </div>
    <div class="status">Tu en seras l'organisateur : tu pourras modifier les inscriptions.</div>
  </div>
  <div class="btnrow"><h3 style="margin:0;">Sorties du club</h3>
    <select id="s_filter" class="mini" onchange="sortieFilter=this.value; loadSorties();">
      <option value="prevue" ${sortieFilter==='prevue'?'selected':''}>Prévues</option>
      <option value="faite" ${sortieFilter==='faite'?'selected':''}>Faites</option>
      <option value="annulee" ${sortieFilter==='annulee'?'selected':''}>Annulées</option>
      <option value="toutes" ${sortieFilter==='toutes'?'selected':''}>Toutes</option>
    </select>
    <button class="secondary small" onclick="loadSorties()">Actualiser</button></div>
  <div id="sorties-cards"></div>`;
}

async function loadSorties(){
  try{ sortiesCache = await apiGet('sorties'); }
  catch(e){ showLoadError('sorties-cards', e); return; }
  try{ catalogueCache = await apiGet('catalogue'); } catch(e){ catalogueCache = []; }
  const sel = document.getElementById('s_cat');
  if(sel && sel.options.length <= 1){
    catalogueCache.slice().sort((a,b)=>String(a.titre).localeCompare(String(b.titre),'fr')).forEach(c => {
      const o = document.createElement('option'); o.value = c.catalogue_id; o.textContent = c.titre; sel.appendChild(o);
    });
  }
  const container = document.getElementById('sorties-cards');
  if(!container) return;
  container.innerHTML = '';
  const list = sortiesCache
    .filter(s => sortieFilter === 'toutes' || (s.statut || 'prevue') === sortieFilter)
    .sort((a,b) => String(a.date||'9999').localeCompare(String(b.date||'9999')) || String(a.titre).localeCompare(String(b.titre),'fr'));
  if(!list.length){ container.innerHTML = '<div class="empty">Aucune sortie dans cette vue.</div>'; return; }
  list.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sortie-card';
    div.onclick = () => { currentSortieId = s.sortie_id; currentSortie = s; render(); };
    const stat = s.statut === 'faite' ? ' · FAITE' : s.statut === 'annulee' ? ' · ANNULÉE' : '';
    div.innerHTML = `<h4>${esc(s.titre)}</h4><div class="sortie-meta">${esc(s.type_activite)} · ${esc(s.mode_nuitee)} · ${esc(s.terrain)} · ${esc(s.saison)} · Difficulté ${esc(s.difficulte)} · ${esc(s.duree_jours)}j · ${esc(s.date || s.annee || 'date libre')}${stat}${s.organisateur?' · org. '+esc(s.organisateur):''}</div>`;
    container.appendChild(div);
  });
}
function prefillFromCatalogue(){
  const id = document.getElementById('s_cat').value;
  const c = catalogueCache.find(x => String(x.catalogue_id) === id);
  if(!c) return;
  const set = (k, v) => { const el = document.getElementById(k); if(el && v !== undefined && v !== null) el.value = v; };
  set('s_titre', c.titre); set('s_activite', c.type_activite); set('s_nuitee', c.mode_nuitee);
  set('s_terrain', c.terrain); set('s_saison', c.saison || 'Été'); set('s_difficulte', String(c.difficulte || 2));

}

let catEditId = null;
async function loadCatalogue(){
  try{ catalogueCache = await apiGet('catalogue'); }
  catch(e){ showLoadError('catalogue-cards', e); return; }
  renderCatalogueList();
}
function renderCatalogueList(){
  const box = document.getElementById('catalogue-cards');
  if(!box) return;
  const q = (document.getElementById('f_q').value || '').toLowerCase();
  const t = document.getElementById('f_type').value;
  const s = document.getElementById('f_saison').value;
  const d = Number(document.getElementById('f_diff').value) || 0;
  const list = catalogueCache.filter(c =>
    (!q || (String(c.titre) + ' ' + String(c.notes) + ' ' + String(c.organisateur)).toLowerCase().includes(q)) &&
    (!t || c.type_activite === t) && (!s || c.saison === s) && (!d || Number(c.difficulte) <= d))
    .sort((a,b) => String(a.titre).localeCompare(String(b.titre),'fr'));
  if(!list.length){ box.innerHTML = '<div class="empty">Aucune idée ne correspond.</div>'; return; }
  box.innerHTML = '';
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'sortie-card';
    div.style.cursor = 'default';
    const topo = /^https?:\/\//.test(String(c.topo)) ? `<a href="${esc(c.topo)}" target="_blank" rel="noopener" style="color:#000;">topo</a>` : esc(c.topo);
    const peutModifier = isBureau() || c.cree_par === currentUser || c.organisateur === currentUser || c.cree_par === 'migration';
    div.innerHTML = `<h4>${esc(c.titre)}</h4>
      <div class="sortie-meta">${esc(c.type_activite)} · ${esc(c.mode_nuitee)} · ${esc(c.terrain)} · ${esc(c.saison || 'saison à préciser')} · Difficulté ${esc(c.difficulte)} · ${esc(c.duree_jours)}j${c.distance_km!==''?' · '+esc(fmtNum(c.distance_km))+' km':''}${c.d_plus!==''?' · D+ '+esc(fmtNum(c.d_plus))+' m':''}${c.organisateur?' · idée de '+esc(c.organisateur):''}</div>
      ${c.topo?`<div class="sortie-meta">${topo}</div>`:''}
      ${c.notes?`<div class="sortie-meta">${esc(String(c.notes).slice(0,200))}</div>`:''}
      <div style="margin-top:10px;"><button class="small" onclick="planifierDepuisCatalogue('${esc(c.catalogue_id)}')">Planifier</button>
      ${peutModifier?`<span class="lnk" onclick="editCatalogue('${esc(c.catalogue_id)}')">modifier</span><span class="lnk" onclick="delCatalogue('${esc(c.catalogue_id)}')">supprimer</span>`:''}</div>`;
    box.appendChild(div);
  });
}
function planifierDepuisCatalogue(id){
  setView('sorties');
  let essais = 0;
  const t = setInterval(() => {
    const sel = document.getElementById('s_cat');
    essais++;
    if(sel && sel.options.length > 1){
      clearInterval(t);
      sel.value = id; prefillFromCatalogue(); window.scrollTo({top:0, behavior:'smooth'});
    } else if(essais > 40) clearInterval(t);
  }, 150);
}
function catBody(){
  return {
    titre: document.getElementById('c_titre').value.trim(),
    type_activite: document.getElementById('c_activite').value,
    mode_nuitee: document.getElementById('c_nuitee').value,
    terrain: document.getElementById('c_terrain').value,
    saison: document.getElementById('c_saison').value,
    difficulte: document.getElementById('c_difficulte').value,
    duree_jours: document.getElementById('c_duree').value,
    distance_km: document.getElementById('c_dist').value,
    d_plus: document.getElementById('c_dplus').value,
    topo: document.getElementById('c_topo').value,
    notes: document.getElementById('c_notes').value,
  };
}
async function saveCatalogue(){
  const body = catBody();
  if(!body.titre) return;
  const r = catEditId ? await apiPost('catalogue_update', {...body, catalogue_id: catEditId}) : await apiPost('catalogue_add', {...body, organisateur: currentUser});
  if(r && r.ok === false){ alert(r.error); return; }
  cancelCatalogueEdit();
  loadCatalogue();
}
function editCatalogue(id){
  const c = catalogueCache.find(x => String(x.catalogue_id) === id);
  if(!c) return;
  catEditId = id;
  const set = (k, v) => { document.getElementById(k).value = (v === undefined || v === null) ? '' : v; };
  set('c_titre', c.titre); set('c_activite', c.type_activite); set('c_nuitee', c.mode_nuitee); set('c_terrain', c.terrain);
  set('c_saison', c.saison || 'Été'); set('c_difficulte', String(c.difficulte || 2)); set('c_duree', c.duree_jours || 1);
  set('c_dist', c.distance_km); set('c_dplus', c.d_plus); set('c_topo', c.topo); set('c_notes', c.notes);
  document.getElementById('cat_form_title').textContent = 'Modifier l\'idée';
  document.getElementById('c_submit').textContent = 'Enregistrer';
  document.getElementById('c_cancel').style.display = 'inline-block';

function cancelCatalogueEdit(){
  catEditId = null;
  ['c_titre','c_dist','c_dplus','c_topo','c_notes'].forEach(k => { const el = document.getElementById(k); if(el) el.value = ''; });

async function delCatalogue(id){

  const r = await apiPost('catalogue_delete', {catalogue_id: id});
  if(r && r.ok === false){ alert(r.error); return; }
  loadCatalogue();
}

async function loadBilan(){
  try{ sortiesCache = await apiGet('sorties'); }
  catch(e){ showLoadError('bilan-liste', e); return; }
  const faites = sortiesCache.filter(s => s.statut === 'faite');
  const years = [...new Set(faites.map(s => Number(s.annee)).filter(Boolean))].sort((a,b) => b-a);
  const cur = new Date().getFullYear();
  if(!years.includes(cur)) years.unshift(cur);
  if(!bilanYear) bilanYear = years[0];
  document.getElementById('b_year').innerHTML = years.map(y => `<option value="${y}" ${y===bilanYear?'selected':''}>${y}</option>`).join('');
  const list = faites.filter(s => Number(s.annee) === bilanYear)
    .sort((a,b) => String(a.date_reelle||a.date||'').localeCompare(String(b.date_reelle||b.date||'')) || String(a.titre).localeCompare(String(b.titre),'fr'));
  const sum = k => list.reduce((t,s) => t + (Number(s[k]) || 0), 0);
  document.getElementById('bilan-totaux').innerHTML = `<div class="weightbar">
    <div><div class="label">Sorties</div><div class="big">${list.length}</div></div>
    <div><div class="label">Distance</div><div class="big">${fmtNum(Math.round(sum('distance_km')*10)/10)} km</div></div>
    <div><div class="label">Dénivelé +</div><div class="big">${fmtNum(sum('d_plus'))} m</div></div>
    <div><div class="label">Jours</div><div class="big">${sum('duree_jours')}</div></div></div>`;
  const box = document.getElementById('bilan-liste');
  if(!list.length){ box.innerHTML = '<div class="empty">Aucune sortie faite cette année.</div>'; return; }
  box.innerHTML = list.map(s => `<div class="item-row"><span>${esc(s.titre)} <span class="note">${esc(s.date_reelle || s.date || '')}${s.nb_participants!==''?' · '+esc(s.nb_participants)+' participants':''}${s.notes_bilan?' · '+esc(s.notes_bilan):''}</span></span>
    <span>${s.distance_km!==''?esc(fmtNum(s.distance_km))+' km':''} ${s.d_plus!==''?'· +'+esc(fmtNum(s.d_plus))+' m':''}</span></div>`).join('');
}

async function refreshParticipants(){
  const parts = await apiGet('participants', {sortie_id: currentSortieId});
  const presentSet = new Set(parts.filter(p => String(p.present) === 'true' || p.present === true).map(p => p.pseudo));
  const container = document.getElementById('participants-list');
  if(!container) return;
  container.innerHTML = '';
  const droitTous = canManage(currentSortie);
  membresCache.forEach(m => {
    const chip = document.createElement('div');
    const editable = droitTous || m.pseudo === currentUser;
    chip.className = 'part-chip' + (presentSet.has(m.pseudo) ? ' present' : '');
    chip.textContent = m.pseudo;
    if(!editable){ chip.style.opacity = '0.55'; chip.style.cursor = 'default'; chip.title = 'Seuls l\'organisateur et le bureau peuvent modifier les autres inscriptions'; }
    chip.onclick = async () => {
      if(!editable) return;
      const nowPresent = !chip.classList.contains('present');
      const r = await apiPost('participant_set', {sortie_id: currentSortieId, pseudo: m.pseudo, present: nowPresent});
      if(r && r.ok === false){ alert(r.error); return; }
      await refreshParticipants();
    };
    container.appendChild(chip);
  });
  await computeAllKits();
}

// ---- moteur (identique aux versions précédentes) ----
function nearestConfort(items, target){
  const order = ['Sommaire','Confortable','Luxe'];
  const ti = order.indexOf(target);
  let best = null, bestDist = 99;
  for(const it of items){ const d = Math.abs(order.indexOf(it.confort) - ti); if(d < bestDist){ bestDist = d; best = it; } }
  return best;
}
function bySaison(items, saison){
  const exact = items.filter(i => i.saison === saison);
  if(exact.length) return exact;
  const multi = items.filter(i => i.saison === 'Multi');
  return multi.length ? multi : items;
}
function lightest(items){ return items.length ? items.reduce((a,b)=> a.poids<=b.poids?a:b) : null; }
function heaviest(items){ return items.length ? items.reduce((a,b)=> a.poids>=b.poids?a:b) : null; }
function pick(sc, saison, confort){ if(!sc||!sc.length) return null; return nearestConfort(bySaison(sc, saison), confort); }
function pickWithIndispensables(sc, saison, confort){
  if(!sc || !sc.length) return [];
  const seasonPool = bySaison(sc, saison);
  const indispensables = seasonPool.filter(i => i.confort === 'Indispensable');
  const normal = seasonPool.filter(i => i.confort !== 'Indispensable');
  const result = [];
  if(normal.length) result.push(nearestConfort(normal, confort));
  const seenNoms = new Set(result.map(r => r.nom));
  indispensables.forEach(i => { if(!seenNoms.has(i.nom)){ result.push(i); seenNoms.add(i.nom); } });
  return result;
}

function computeKit(catalog, params){
  const {nuitee, terrain, saison, confort, duree, difficulte, isCourse, autonomieRepas} = params;
  let individualWeight = 0;
  const sections = {};
  const collectifProposals = [];
  const warnings = [];
  function checkEmpty(l, a){ if(!a || !a.length) warnings.push(l); }

  if(nuitee !== 'Journée'){
    const couchage = [];
    if(nuitee === 'Refuge'){
      const duvetPool = bySaison(catalog.couchage['Duvet']||[], saison);
      const normalDuvet = duvetPool.filter(i => i.confort !== 'Indispensable');
      const indispDuvet = duvetPool.filter(i => i.confort === 'Indispensable');
      const item = lightest(normalDuvet);
      checkEmpty('Duvet', duvetPool);
      if(item){ couchage.push({label:item.nom, poids:item.poids, note:'le plus léger'}); individualWeight += item.poids; }
      indispDuvet.forEach(d => { couchage.push({label:d.nom, poids:d.poids}); individualWeight += d.poids; });
    } else {
      checkEmpty('Tente', catalog.couchage['Tente']);
      checkEmpty('Matelas', catalog.couchage['Matelas']);
      checkEmpty('Duvet', catalog.couchage['Duvet']);
      pickWithIndispensables(catalog.couchage['Tente'], saison, confort).forEach(t => collectifProposals.push({label:t.nom, poids:t.poids, subcat:'Tente'}));
      pickWithIndispensables(catalog.couchage['Matelas'], saison, confort).forEach(m => { couchage.push({label:m.nom, poids:m.poids}); individualWeight += m.poids; });
      pickWithIndispensables(catalog.couchage['Duvet'], saison, confort).forEach(d => { couchage.push({label:d.nom, poids:d.poids}); individualWeight += d.poids; });
      couchage.push({label:'Sac étanche / sursac', poids:150, note:'estimé'}); individualWeight += 150;
    }
    if(confort === 'Luxe'){
      const bonus = pick(catalog.couchage['Bonus'], saison, confort);
      if(bonus){ couchage.push({label:bonus.nom, poids:bonus.poids, note:'bonus'}); individualWeight += bonus.poids; }
    }
    sections['Couchage'] = couchage;
  }

  const vet = [];
  checkEmpty('Couche protectrice', catalog.vetements['Couche protectrice']);
  pickWithIndispensables(catalog.vetements['Couche protectrice'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  checkEmpty('Couche isolante', catalog.vetements['Couche isolante']);
  pickWithIndispensables(catalog.vetements['Couche isolante'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  if(saison === 'Froide'){
    bySaison(catalog.vetements['Sous-couche chaude']||[], saison).forEach(i => { vet.push({label:i.nom, poids:i.poids, note:'base layer'}); individualWeight += i.poids; });
  }
  checkEmpty('Couche transpirante', catalog.vetements['Couche transpirante']);
  pickWithIndispensables(catalog.vetements['Couche transpirante'], saison, confort).forEach((it, idx) => { vet.push({label:it.nom, poids:it.poids, note:(idx===0 && duree>=2)?'+1 rechange conseillé':''}); individualWeight += it.poids; });
  checkEmpty('Pantalons et shorts', catalog.vetements['Pantalons et shorts']);
  pickWithIndispensables(catalog.vetements['Pantalons et shorts'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  const extremites = bySaison(catalog.vetements['Extrémités']||[], saison);
  const seen = {};
  extremites.forEach(i => {
    if(seen[i.nom]) return; seen[i.nom] = true;
    const chosen = nearestConfort(extremites.filter(x=>x.nom===i.nom), confort);
    vet.push({label:chosen.nom, poids:chosen.poids}); individualWeight += chosen.poids;
  });
  if(nuitee !== 'Journée' && nuitee !== 'Refuge'){
    vet.push({label:'Vêtement de rechange sec', poids:150, note:'estimé'}); individualWeight += 150;
  }
  sections['Vêtements'] = vet;

  const eq = [];
  const isCourseVal = isCourse;
  if(autonomieRepas){
    checkEmpty('Cuisine', catalog.equipements['Cuisine']);
    const cuisineItems = bySaison(catalog.equipements['Cuisine']||[], saison);
    const seenC = {};
    cuisineItems.forEach(i => {
      if(seenC[i.nom]) return; seenC[i.nom] = true;
      const variants = cuisineItems.filter(x=>x.nom===i.nom);
      collectifProposals.push({label: nearestConfort(variants, confort).nom, poids: nearestConfort(variants, confort).poids, subcat:'Cuisine'});
    });
  }
  checkEmpty('Survie', catalog.equipements['Survie']);
  pickWithIndispensables(catalog.equipements['Survie'], saison, confort).forEach(s => { eq.push({label:s.nom, poids:s.poids}); individualWeight += s.poids; });
  checkEmpty('Hydratation', catalog.equipements['Hydratation']);
  pickWithIndispensables(catalog.equipements['Hydratation'], saison, confort).forEach(hydra => {
    eq.push({label:hydra.nom, poids:hydra.poids}); individualWeight += hydra.poids;
    if(duree >= 2 || saison === 'Chaude'){ eq.push({label:hydra.nom, poids:hydra.poids, note:'unité supplémentaire'}); individualWeight += hydra.poids; }
  });
  checkEmpty('Hygiène et nuit', catalog.equipements['Hygiène et nuit']);
  pickWithIndispensables(catalog.equipements['Hygiène et nuit'], saison, confort).forEach(it => { eq.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  checkEmpty('Sac', catalog.equipements['Sac']);
  const sacPool = bySaison(catalog.equipements['Sac']||[], saison);
  const sac = (isCourseVal || nuitee === 'Journée') ? lightest(sacPool) : heaviest(sacPool);
  if(sac){ eq.push({label:sac.nom, poids:sac.poids}); individualWeight += sac.poids; }
  sections['Équipements'] = eq;

  const nut = [];
  nut.push({label:'Barres énergétiques / fruits secs', poids:150*duree, note:`${duree}j × 150g`}); individualWeight += 150*duree;
  if(isCourse){ nut.push({label:'Gels énergétiques (x4)', poids:160, note:'estimé'}); individualWeight += 160; }
  if(!autonomieRepas && nuitee === 'Journée'){ nut.push({label:'Pique-nique complet', poids:500, note:'estimé'}); individualWeight += 500; }
  if(autonomieRepas){
    nut.push({label:'Repas du soir (lyophilisé)', poids:150*duree, note:`${duree} nuit(s)`}); individualWeight += 150*duree;
    nut.push({label:'Petit-déjeuner', poids:100*duree, note:`${duree}j`}); individualWeight += 100*duree;
  }
  sections['Nutrition'] = nut;

  const divers = [];
  divers.push({label:'Trousse de secours de base', poids:150, note:'estimé'}); individualWeight += 150;
  divers.push({label:'Crème solaire', poids:100, note:'estimé'}); individualWeight += 100;
  const lunPoids = (terrain==='Neige'||terrain==='Glacier') ? 60 : 30;
  divers.push({label:(terrain==='Neige'||terrain==='Glacier')?'Lunettes de glacier (cat.4)':'Lunettes de soleil', poids:lunPoids, note:'estimé'}); individualWeight += lunPoids;
  divers.push({label:'Batterie externe', poids:200, note:'estimé'}); individualWeight += 200;
  sections['Sécurité & divers'] = divers;

  const tech = [];
  function addTech(label, note){
    const poids = TECH_POIDS[label] || 0;
    if(TECH_COLLECTIF.includes(label)){
      collectifProposals.push({label, poids, subcat:'Technique', note:'estimé'});
    } else {
      tech.push({label, poids, note:(note?note+' — ':'')+'estimé'}); individualWeight += poids;
    }
  }
  if(terrain === 'Glacier'){
    addTech('Crampons (paire)'); addTech('Piolet'); addTech('Casque alpi'); addTech('Baudrier');
    addTech("Corde d'encordement (partagée, ~60m/9mm)"); addTech('Broches à glace (kit)');
    if(difficulte >= 4){ addTech('DVA'); addTech('Pelle à neige'); addTech('Sonde avalanche'); }
  } else if(terrain === 'Rocher/Neige technique'){
    addTech('Crampons (paire)'); addTech('Piolet ou bâtons renforcés'); addTech('Casque alpi');
  } else if(terrain === 'Neige'){
    addTech('Raquettes à neige (paire)'); addTech('Bâtons (paire)'); addTech('Guêtres');
    if(difficulte >= 4){ addTech('DVA'); addTech('Pelle à neige'); addTech('Sonde avalanche'); }
  } else if(terrain === 'Route'){
    addTech('Casque vélo'); addTech('Kit de réparation / crevaison');
  } else if(terrain === 'Eau'){
    addTech('Matériel pêche / vêtements étanches');
  }
  if(difficulte >= 4) addTech('GPS (si pas de smartphone fiable)', 'sécurité');
  if(tech.length) sections['Matériel technique'] = tech;

  return { sections, individualWeight, collectifProposals, warnings };
}

async function computeAllKits(){
  const parts = await apiGet('participants', {sortie_id: currentSortieId});
  const present = parts.filter(p => String(p.present) === 'true' || p.present === true).map(p => p.pseudo);
  kitCache = {};
  const params = {
    nuitee: currentSortie.mode_nuitee, terrain: currentSortie.terrain, saison: saisonEquip(currentSortie.saison),
    confort: 'Confortable', duree: Number(currentSortie.duree_jours) || 1, difficulte: Number(currentSortie.difficulte) || 1,
    isCourse: ['Trail','Course à pied'].includes(currentSortie.type_activite),
    autonomieRepas: ['Bivouac','Cabane','Mixte'].includes(currentSortie.mode_nuitee),
  };
  for(const pseudo of present){
    const items = await apiGet('inventaire', {pseudo});
    kitCache[pseudo] = computeKit(catalogFromItems(items), params);
  }
  await renderCollectifAndRecap(present);
}

async function renderCollectifAndRecap(present){
  const bySubcat = {};
  present.forEach(pseudo => {
    (kitCache[pseudo].collectifProposals || []).forEach(p => {
      if(!bySubcat[p.subcat]) bySubcat[p.subcat] = [];
      bySubcat[p.subcat].push(p);
    });
  });
  const groupCollectifItems = [];
  for(const subcat of Object.keys(bySubcat)){
    const uniqueByLabel = {};
    bySubcat[subcat].forEach(p => { if(!uniqueByLabel[p.label] || p.poids < uniqueByLabel[p.label].poids) uniqueByLabel[p.label] = p; });
    Object.values(uniqueByLabel).forEach(p => groupCollectifItems.push(p));
  }

  const existingAttrib = await apiGet('attribution', {sortie_id: currentSortieId});
  const attribMap = {};
  existingAttrib.forEach(a => attribMap[a.objet] = a.pseudo_porteur);

  const container = document.getElementById('collectif-list');
  if(!container) return;
  container.innerHTML = '';
  if(!groupCollectifItems.length){ container.innerHTML = '<div class="empty">Aucun matériel collectif détecté pour cette sortie.</div>'; }
  groupCollectifItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'collectif-row';
    const assigned = attribMap[item.label] || '';
    const options = present.map(p => `<option value="${p}" ${p===assigned?'selected':''}>${p}</option>`).join('');
    row.innerHTML = `<span>${item.label} <span class="note">${item.poids}g${item.note?(' — '+item.note):''}</span></span>
      <select class="mini" onchange="reassign('${item.label.replace(/'/g,"\\'")}', ${item.poids}, this.value)">${options}</select>`;
    container.appendChild(row);
  });

  window._groupCollectifItems = groupCollectifItems;
  renderRecap(present, groupCollectifItems, attribMap);
}

async function reassign(objet, poids, pseudo){
  await apiPost('attribution_set', {sortie_id: currentSortieId, objet, poids_g: poids, pseudo_porteur: pseudo});
  await computeAllKits();
}

async function autoAssign(){
  const items = (window._groupCollectifItems || []).slice().sort((a,b) => b.poids - a.poids);
  const parts = await apiGet('participants', {sortie_id: currentSortieId});
  const present = parts.filter(p => String(p.present) === 'true' || p.present === true).map(p => p.pseudo);
  const running = {};
  present.forEach(p => running[p] = kitCache[p] ? kitCache[p].individualWeight : 0);
  for(const item of items){
    let minP = present[0];
    present.forEach(p => { if(running[p] < running[minP]) minP = p; });
    await apiPost('attribution_set', {sortie_id: currentSortieId, objet: item.label, poids_g: item.poids, pseudo_porteur: minP});
    running[minP] += item.poids;
  }
  await computeAllKits();
}

function renderRecap(present, groupCollectifItems, attribMap){
  const container = document.getElementById('recap-list');
  if(!container) return;
  container.innerHTML = '';
  let grandTotal = 0;
  present.forEach(pseudo => {
    const kit = kitCache[pseudo];
    if(!kit) return;
    const collectifCarried = groupCollectifItems.filter(it => attribMap[it.label] === pseudo);
    const collectifWeight = collectifCarried.reduce((s,i) => s + i.poids, 0);
    const total = kit.individualWeight + collectifWeight;
    grandTotal += total;
    const div = document.createElement('div');
    div.className = 'recap-card';
    let sectionsHtml = Object.entries(kit.sections).map(([name, items]) => {
      if(!items.length) return '';
      return `<div class="subcat-label">${name}</div>` + items.map(i => `<div class="item-row"><span>${i.label}${i.note?` <span class="note">(${i.note})</span>`:''}</span><span>${i.poids}g</span></div>`).join('');
    }).join('');
    const collectifHtml = collectifCarried.length ? `<div class="subcat-label">Matériel collectif porté</div>` +
      collectifCarried.map(i => `<div class="item-row"><span>${i.label}</span><span>${i.poids}g</span></div>`).join('') : '';
    const warnHtml = kit.warnings.length ? `<div class="warn">Inventaire incomplet pour : ${kit.warnings.join(', ')}</div>` : '';
    div.innerHTML = `<h4>${pseudo} <span>${(total/1000).toFixed(2)} kg</span></h4>${sectionsHtml}${collectifHtml}${warnHtml}`;
    container.appendChild(div);
  });
  document.getElementById('detail-weightbar').innerHTML = present.length
    ? `<div><div class="label">Poids total groupe</div><div class="big">${(grandTotal/1000).toFixed(2)} kg</div></div><div class="note">${present.length} participant(s)</div>`
    : '<div class="empty">Aucun participant coché.</div>';
}

// ================= Repas =================
async function refreshRepas(){
  const repas = await apiGet('repas', {sortie_id: currentSortieId});
  const container = document.getElementById('repas-list');
  if(!container) return;
  container.innerHTML = '';
  const byJour = {};
  repas.forEach(r => { (byJour[r.jour] = byJour[r.jour] || []).push(r); });
  Object.keys(byJour).sort((a,b)=>a-b).forEach(jour => {
    const div = document.createElement('div');
    div.className = 'repas-day';
    let html = `<h5>Jour ${jour}</h5>`;
    byJour[jour].forEach(r => {
      html += `<div class="repas-item"><span>${r.moment} — ${r.plat} <span class="note">(${r.responsable}, ${r.portions} pers.)</span></span>
        <span class="lnk" onclick="delRepas(${jour},'${r.moment}','${r.plat.replace(/'/g,"\\'")}','${r.responsable}')">supprimer</span></div>`;
    });
    div.innerHTML = html;
    container.appendChild(div);
  });
  if(!repas.length) container.innerHTML = '<div class="empty">Aucun repas renseigné.</div>';
}
async function addRepas(){
  const body = {
    sortie_id: currentSortieId,
    jour: document.getElementById('r_jour').value,
    moment: document.getElementById('r_moment').value,
    plat: document.getElementById('r_plat').value,
    responsable: document.getElementById('r_resp').value || currentUser,
    portions: document.getElementById('r_portions').value,
  };
  if(!body.plat) return;
  await apiPost('repas_add', body);
  refreshRepas();
}
async function delRepas(jour, moment, plat, responsable){
  await apiPost('repas_delete', {sortie_id: currentSortieId, jour, moment, plat, responsable});
  refreshRepas();
}
