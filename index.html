<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BMG">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>BMG Pyrénées Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F0; --card:#fff; --line:#D5D8CF; --ink:#0A1E1E; --muted:#4F5557; --nav-h:64px;
    --green:#5FAD56; --green-dark:#2E6B2A; --green-soft:#E7F2E4; --warn:#B3261E;
  }
  *{box-sizing:border-box;}
  html{font-size:16px;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',Arial,sans-serif; font-size:15px; line-height:1.5;}
  a{color:var(--ink);}
  h1,h2,h3,h4,h5{margin:0;}

  /* ---- En-tête ---- */
  header.top{background:#fff; border-bottom:1px solid var(--ink); position:sticky; top:0; z-index:20;}
  .top-in{max-width:1040px; margin:0 auto; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand h1{font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:32px; line-height:1; letter-spacing:-0.01em;}
  .logo{height:68px; width:auto; display:block;}
  .top-right{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .user{font-size:15px; color:var(--muted);}
  .user b{color:var(--ink); font-weight:600;}
  .wrap{max-width:1040px; margin:0 auto; padding:8px 24px 72px;}
  .sub{color:var(--muted); font-size:14px; margin:16px 0;}

  /* ---- Onglets ---- */
  .tabs{display:flex; gap:4px; margin:24px 0 28px; border-bottom:2px solid var(--line); overflow-x:auto;}
  .tab{background:none; color:var(--muted); border:none; border-bottom:4px solid transparent; margin-bottom:-2px; border-radius:0; padding:12px 20px; font-size:16px; font-weight:600; white-space:nowrap;}
  .tab:hover{background:rgba(0,0,0,.04); color:var(--ink);}
  .tab.active{color:var(--ink); border-bottom-color:var(--green); background:none;}

  /* ---- Titres ---- */
  h2.page-title{font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:36px; line-height:1.1; margin:4px 0 6px;}
  .page-sub{color:var(--muted); font-size:15px; margin:0 0 24px; max-width:640px;}
  h3{font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:18px; line-height:1.25; margin:0 0 16px; padding-left:12px; border-left:5px solid var(--green);}
  h4{font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:16px; margin:0 0 6px;}
  h5{font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 4px;}

  /* ---- Cartes / panneaux ---- */
  .panel{background:var(--card); border:1px solid var(--line); padding:24px; margin-bottom:24px;}
  #identity-panel{max-width:520px; margin-top:24px;}
  .actionbar{margin:0 0 20px;}
  .backbar{margin:24px 0 8px;}
  .btnrow{display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .btnrow h3{margin:0;}

  /* ---- Formulaires ---- */
  label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px;}
  select, input[type=number], input[type=text], input[type=date], input[type=time], input[type=url], input[type=search]{width:100%; padding:10px 12px; border:1px solid #8E948E; border-radius:3px; background:#fff; color:var(--ink); font-family:inherit; font-size:15px; -webkit-appearance:none; appearance:none;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='black'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:34px; cursor:pointer;}
  select:focus, input:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(95,173,86,.4);}
  select.mini{width:auto; padding:7px 32px 7px 10px; font-size:14px;}
  .grid{display:grid; gap:18px 20px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); align-items:end;}

  /* ---- Boutons ---- */
  button{font-family:inherit; font-size:14px; font-weight:700; padding:11px 20px; background:var(--green); color:#0B2A08; border:1px solid var(--green-dark); border-radius:3px; cursor:pointer; letter-spacing:.01em;}
  button:hover{background:var(--green-dark); color:#fff;}
  button.outline{background:#fff; color:var(--ink); border:1px solid var(--ink);}
  button.outline:hover, button.outline.active{background:var(--ink); color:#fff;}
  button.secondary{background:none; border:none; color:var(--ink); text-decoration:underline; padding:0; font-weight:500;}
  button.secondary:hover{background:none; color:var(--green-dark);}
  button.small{padding:7px 14px; font-size:13px;}
  button.secondary.small{padding:0;}

  /* ---- Textes d'appoint ---- */
  .note{display:block; font-size:13px; color:var(--muted);}
  .lnk{font-size:13px; font-weight:500; color:var(--ink); cursor:pointer; text-decoration:underline; margin-left:14px;}
  .lnk:hover{color:var(--green-dark);}
  .empty{color:var(--muted); font-size:14px; padding:6px 0;}
  .warn{border-left:4px solid var(--warn); background:#FBECEA; padding:10px 14px; margin:14px 0; font-size:14px;}
  .status{font-size:13px; color:var(--muted); margin-top:14px;}
  .sortie-meta{font-size:14px; color:var(--muted);}
  .subcat-label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 4px;}

  /* ---- Pastilles ---- */
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0;}
  .chip{font-size:12px; font-weight:500; background:#EEF0EA; border:1px solid var(--line); padding:3px 10px; border-radius:999px; color:#222;}
  .chip.strong{background:#fff; border-color:var(--ink); font-weight:600;}
  .chip.todo{background:#FFF4D6; border-color:#D9B44A;}
  .badge{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:4px 10px; border-radius:3px; white-space:nowrap;}
  .badge.prevue{background:var(--green-soft); color:var(--green-dark); border:1px solid var(--green);}
  .badge.faite{background:var(--ink); color:#fff; border:1px solid var(--ink);}
  .badge.annulee{background:#EEE; color:#666; border:1px solid #CCC; text-decoration:line-through;}
  .detail-badges{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0;}

  /* ---- Cartes de sorties / idées ---- */
  .sortie-card, .idea-card{display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--line); border-left:5px solid var(--green); padding:16px 18px; margin-bottom:12px;}
  .sortie-card{cursor:pointer;}
  .sortie-card:hover{border-color:var(--ink); border-left-color:var(--green-dark); box-shadow:0 2px 0 rgba(0,0,0,.1);}
  .sc-date{flex:0 0 68px; text-align:center; background:var(--green-soft); padding:8px 6px;}
  .sc-date.nodate{background:#EEF0EA;}
  .sc-day{font-size:26px; font-weight:700; line-height:1;}
  .sc-mon{font-size:12px; font-weight:700; text-transform:uppercase; color:var(--green-dark);}
  .sc-dur{font-size:11px; color:var(--muted);}
  .sc-body{flex:1; min-width:0;}
  .sc-body h4{font-size:17px;}
  .sc-orga{font-size:13px; color:var(--muted); margin-top:6px;}
  .idea-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .idea-card{align-items:flex-start;}

  /* ---- Inventaire perso ---- */
  .cats{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
  .cat{background:var(--card); border:1px solid var(--line); padding:18px 20px;}
  .cat h4{font-size:16px; padding-bottom:8px; border-bottom:2px solid var(--green); margin-bottom:6px;}
  .item-row{font-size:14px; padding:7px 0; display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid #ECEEE8;}

  /* ---- Détail d'une sortie ---- */
  .participants-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .part-chip{padding:8px 14px; border:1px solid #8E948E; font-size:14px; font-weight:500; cursor:pointer; background:#fff; color:var(--ink); border-radius:999px;}
  .part-chip.present{background:var(--green); border-color:var(--green-dark); font-weight:700; color:#0B2A08;}
  .part-chip:hover{background:var(--green-soft); color:var(--ink);}
  .part-chip.present:hover{background:var(--green-dark); color:#fff;}
  .part-chip:disabled:hover{background:#fff; color:var(--ink);}
  .part-chip.present:disabled:hover{background:var(--green); color:#0B2A08;}
  .recap-card{background:var(--card); border:1px solid var(--line); padding:18px 20px; margin-bottom:16px;}
  .recap-card h4{display:flex; justify-content:space-between; align-items:baseline; font-size:17px; padding-bottom:8px; border-bottom:2px solid var(--green); margin-bottom:6px;}
  .collectif-row{display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:14px; padding:8px 0; border-bottom:1px solid #ECEEE8;}
  .repas-day{margin-bottom:16px;}
  .repas-item{font-size:14px; display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid #ECEEE8;}
  .weightbar{display:flex; align-items:baseline; gap:32px; flex-wrap:wrap; background:var(--green-soft); border:1px solid var(--green); padding:18px 22px;}
  .weightbar .big{font-size:36px; font-weight:700; line-height:1.1;}
  .weightbar .label, .weightbar .note{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--green-dark);}

  /* ---- Bilan ---- */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
  .stat{background:var(--card); border:1px solid var(--line); border-top:4px solid var(--green); padding:16px 18px;}
  .stat-n{font-size:32px; font-weight:700; line-height:1.1;}
  .stat-l{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}

  .toast{position:fixed; left:50%; bottom:calc(28px + var(--nav-offset, 0px)); transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:13px 22px; border-left:5px solid var(--green); font-size:15px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90vw;}
  .toast.show{opacity:1; transform:translate(-50%,0);}


  /* ---- En-tête : identité ---- */
  .userbtn{display:inline-flex; align-items:center; gap:10px; background:none; border:1px solid var(--line); color:var(--ink); padding:5px 14px 5px 5px; border-radius:999px; font-weight:600; font-size:14px;}
  .userbtn:hover{background:var(--green-soft); color:var(--ink);}
  .avatar{width:32px; height:32px; border-radius:50%; background:var(--green); color:#0B2A08; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; letter-spacing:.02em;}
  .who-hint{font-size:14px; color:var(--muted); margin:10px 0 0;}

  /* ---- Barre d'onglets du bas (téléphone) ---- */
  .bottomnav{display:none; position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid var(--ink); padding:6px 8px calc(6px + env(safe-area-inset-bottom)); justify-content:space-around;}
  .bottomnav button{flex:1; background:none; border:none; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; font-size:12px; font-weight:600; border-radius:10px;}
  .bottomnav button svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .bottomnav button.active{color:var(--green-dark); background:var(--green-soft);}
  .bottomnav button:hover{background:var(--green-soft); color:var(--ink);}

  /* ---- Mise en page ---- */
  .full{grid-column:1/-1;}
  .section{margin-top:44px;}
  .lead{font-size:15px; color:var(--muted); margin:-6px 0 18px; max-width:620px;}
  .check{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:500; color:var(--ink); cursor:pointer;}
  .check input{width:20px; height:20px; accent-color:var(--green-dark);}
  input[type=file]{font-family:inherit; font-size:14px; max-width:100%;}
  .toolbar{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .count{font-size:14px; color:var(--muted); font-weight:500;}

  /* ---- Cartes de sortie : inscription ---- */
  .sc-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .badge.moi{background:var(--green); color:#0B2A08; border:1px solid var(--green-dark);}
  .sc-people{font-size:13px; color:var(--muted);}

  /* ---- Lieu de départ ---- */
  .lieu-row{display:flex; gap:8px;}
  .lieu-row input{flex:1;}
  .lieu-res{display:flex; flex-direction:column; gap:4px; margin-top:6px;}
  .lieu-res button{background:#fff; color:var(--ink); border:1px solid var(--line); text-align:left; font-weight:500;}
  .lieu-res button:hover{background:var(--green-soft); color:var(--ink);}
  .lieu-ok{font-size:13px; color:var(--green-dark); margin-top:6px; font-weight:600;}

  /* ---- Fiche sortie ---- */
  .hero-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
  button.go{font-size:16px; padding:14px 22px;}
  button.go.on{background:#fff; color:var(--green-dark); border:2px solid var(--green);}
  button.go.on:hover{background:var(--green-soft);}
  .quiet-links{margin-top:14px;}
  .quiet-links .lnk:first-child{margin-left:0;}

  /* ---- Météo ---- */
  .wx{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .wx-day{border:1px solid var(--line); border-top:4px solid var(--green); padding:12px 14px; background:#FBFCFA;}
  .wx-day.bad{border-top-color:#D9B44A;}
  .wx-day.storm{border-top-color:var(--warn);}
  .wx-date{font-size:13px; font-weight:700; text-transform:capitalize;}
  .wx-ico{font-size:30px; line-height:1.2; margin:4px 0;}
  .wx-lbl{font-size:14px; font-weight:600;}
  .wx-t{font-size:22px; font-weight:700; margin:4px 0;}
  .wx-t span{font-size:15px; color:var(--muted); font-weight:500;}
  .wx-l{font-size:13px; color:var(--muted);}
  .wx-src{font-size:12px; color:var(--muted); margin-top:10px;}

  /* ---- Trace : carte + profil ---- */
  .map{height:320px; border:1px solid var(--line); background:#E9ECE4; z-index:1;}
  .profile{margin-top:12px; touch-action:none; user-select:none; -webkit-user-select:none;}
  .profile svg{width:100%; height:auto; display:block;}
  .profile-read{font-size:14px; font-weight:600; min-height:21px; margin-top:4px;}
  .tstats{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin:14px 0;}
  .tstat{border-left:4px solid var(--green); padding:2px 0 2px 10px;}
  .tstat b{display:block; font-size:20px;}
  .tstat span{font-size:13px; color:var(--muted);}
  details.manage{margin-top:18px; border-top:1px solid var(--line); padding-top:14px;}
  details.manage summary{cursor:pointer; font-weight:600; font-size:14px;}

  /* ---- Covoiturage ---- */
  .cars{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
  .car{border:1px solid var(--line); border-left:5px solid var(--green); padding:14px 16px; background:#FBFCFA;}
  .car.full{border-left-color:#9AA19A;}
  .car.mine{border-left-color:var(--green-dark); background:var(--green-soft);}
  .car-head{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .car-who{font-weight:700; font-size:16px;}
  .car-from{font-size:14px; color:var(--muted); margin-top:2px;}
  .car-free{font-size:13px; font-weight:700; color:var(--green-dark); white-space:nowrap;}
  .car.full .car-free{color:var(--muted);}
  .seats{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px;}
  .seat{font-size:13px; padding:4px 10px; border-radius:999px; background:#fff; border:1px solid var(--ink);}
  .seat.empty{border:1px dashed #8E948E; color:var(--muted);}
  .car-note{font-size:13px; color:var(--muted); margin-top:6px;}
  .car-actions{display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:12px;}
  .car-actions .lnk, .toolbar .lnk{margin-left:0;}
  .covoit-sum{font-size:14px; margin:0 0 14px;}
  .covoit-sum b{font-weight:700;}
  .without{margin-top:14px; font-size:14px;}

  /* ---- Accessibilité ---- */
  :focus-visible{outline:3px solid var(--green-dark); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; scroll-behavior:auto !important;} }

  @media (max-width: 700px){
    :root{--nav-offset:calc(var(--nav-h) + env(safe-area-inset-bottom));}
    body.logged{padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));}
    body.logged .bottomnav{display:flex;}
    body.logged #subnav{display:none !important;}
    #btn-inv{display:none !important;}
    .top-right{width:auto;}
    .userbtn .uname{max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    button{min-height:44px;}
    button.small{min-height:38px;}
    .bottomnav button{min-height:0;}
    .map{height:260px;}
    .grid.two{grid-template-columns:1fr 1fr;}
    .wx{grid-template-columns:1fr 1fr;}
    .sc-side{flex-direction:row; width:100%; justify-content:flex-start; align-items:center;}
    .idea-card{flex-direction:column; align-items:stretch; gap:12px;}
    .idea-actions{justify-content:flex-start;}
    .sortie-card .sc-body{flex:1 1 calc(100% - 80px);}
    .section{margin-top:36px;}
  }

  @media (max-width: 600px){
    .top-in{padding:10px 16px;}
    .wrap{padding:4px 16px 56px;}
    .logo{height:40px;}
    h2.page-title{font-size:28px;}
    .tab{padding:10px 12px; font-size:14px;}
    .sortie-card, .idea-card{flex-wrap:wrap; gap:12px;}
    .sc-date{flex:0 0 58px;}
    .user{font-size:13px;}
    .grid, .cats{grid-template-columns:1fr;}
    .weightbar .big{font-size:28px;}
    .panel{padding:18px;}
  }
</style>
</head>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzA0dUcNliIBSHST4GAIQGuep5KYQSJS9QGYBjXffRbuwAWYO-E_XGHpL6GX2aCCy4n/exec';

  vetements: ['Couche protectrice','Couche isolante','Sous-couche chaude','Couche transpirante','Pantalons et shorts','Extrémités'],
  equipements: ['Cuisine','Survie','Hydratation','Hygiène et nuit','Sac']
};
const TECH_POIDS = {
  'Crampons (paire)': 900, 'Piolet': 450, 'Piolet ou bâtons renforcés': 500,
  'Casque alpi': 350, 'Baudrier': 400,
  "Corde d'encordement (partagée, ~60m/9mm)": 2000, 'Broches à glace (kit)': 300,
  'DVA': 200, 'Pelle à neige': 500, 'Sonde avalanche': 250,
  'Raquettes à neige (paire)': 1800, 'Bâtons (paire)': 500, 'Guêtres': 250,
  'Casque vélo': 250, 'Kit de réparation / crevaison': 400,
  'Matériel pêche / vêtements étanches': 800, 'GPS (si pas de smartphone fiable)': 150,
};
const TECH_COLLECTIF = ["Corde d'encordement (partagée, ~60m/9mm)", 'Broches à glace (kit)'];

const SAISONS = ['Été','Automne','Hiver','Printemps','Toutes saisons'];
const TYPES = ['Randonnée','Trek','Bivouac','Alpinisme','Trail','Course à pied','Cyclisme','VTT','Découverte','Évènement','Évènement sportif'];
const NUITEES = ['Journée','Refuge','Bivouac','Cabane','Mixte'];
const TERRAINS = ['Sentier','Neige','Glacier','Rocher/Neige technique','Route','Eau'];
// Saison de la sortie (4 saisons) -> saison utilisée pour composer le kit (Chaude/Froide)
function saisonEquip(s){
  if(s === 'Chaude' || s === 'Froide') return s;
  return ({'Été':'Chaude','Printemps':'Chaude','Automne':'Froide','Hiver':'Froide'})[s] || 'Froide';
}
let toastTimer = null;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg;
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
function esc(v){ return String(v === undefined || v === null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function opts(list, sel){ return list.map(o => `<option value="${esc(o)}" ${o===sel?'selected':''}>${esc(o)}</option>`).join(''); }
function isBureau(){ const m = membresCache.find(x => x.pseudo === currentUser); return !!m && m.role === 'bureau'; }
function canManage(s){ return isBureau() || (!!s && !!s.organisateur && s.organisateur === currentUser); }
function fmtNum(n){ return (n === '' || n === null || n === undefined) ? '' : Number(n).toLocaleString('fr-FR'); }
let catalogueCache = [];
const MOIS = ['JAN','FÉV','MAR','AVR','MAI','JUN','JUL','AOÛ','SEP','OCT','NOV','DÉC'];
function chips(list){
  const l = list.filter(x => x !== '' && x !== null && x !== undefined);
  return l.length ? '<div class="chips">' + l.map(x => `<span class="chip">${esc(x)}</span>`).join('') + '</div>' : '';
}
function metaChips(s, withDuree){
  return chips([s.type_activite, s.mode_nuitee, s.terrain, s.saison,
    (s.difficulte !== '' && s.difficulte !== undefined) ? 'Difficulté ' + s.difficulte + '/5' : '',
    withDuree && s.duree_jours ? s.duree_jours + ' j' : '',
    (s.distance_km !== '' && s.distance_km !== undefined) ? fmtNum(s.distance_km) + ' km' : '',
    (s.d_plus !== '' && s.d_plus !== undefined) ? 'D+ ' + fmtNum(s.d_plus) + ' m' : '']);

function dateBlock(s){

  if(!m){

}
function fmtDateLong(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ''));

async function apiGet(action, params){
  params = params || {};
  const qs = Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const url = `${API_URL}?action=${action}${qs ? '&'+qs : ''}&_ts=${Date.now()}`;
  const res = await fetch(url, {cache:'no-store'});
  const data = await res.json();
  if(data && !Array.isArray(data) && data.error) throw new Error(data.error);
  return data;
}
function showLoadError(id, e){
  const el = document.getElementById(id);
  if(el) el.innerHTML = `<div class="warn">Impossible de charger les données (${esc(e && e.message ? e.message : e)}). Vérifie que le script est redéployé en « Nouvelle version » puis recharge la page (Ctrl+Maj+R).</div>`;

async function apiPost(action, body){
  body = body || {};
  try{
    const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, acteur: currentUser, app_url: location.origin + location.pathname, ...body})});
    const data = await res.json();
    if(data && data.error && data.ok === undefined) return {ok:false, error: data.error + ' — le script déployé n\'est probablement pas à jour (Déployer > Gérer les déploiements > Nouvelle version).'};

}

async function chercherLieu(p){

// Lecture d'un fichier GPX : points, distance, dénivelés, point de départ
function haversine(a, b){
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const x = Math.sin(dLat/2) ** 2 + Math.cos(a[0]*r) * Math.cos(b[0]*r) * Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function parseGpx(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('fichier illisible');
  let nodes = Array.from(doc.getElementsByTagName('trkpt'));
  if(nodes.length < 2) nodes = Array.from(doc.getElementsByTagName('rtept'));
  if(nodes.length < 2) throw new Error('aucune trace trouvée dans ce fichier');
  const pts = [];
  let dist = 0, dplus = 0, dminus = 0, ref = null, eMin = Infinity, eMax = -Infinity;
  nodes.forEach(n => {
    const lat = parseFloat(n.getAttribute('lat')), lon = parseFloat(n.getAttribute('lon'));
    if(isNaN(lat) || isNaN(lon)) return;
    const eleN = n.getElementsByTagName('ele')[0];
    const ele = eleN ? parseFloat(eleN.textContent) : null;
    if(pts.length) dist += haversine(pts[pts.length-1], [lat, lon]);
    if(ele !== null && !isNaN(ele)){
      eMin = Math.min(eMin, ele); eMax = Math.max(eMax, ele);
      if(ref === null) ref = ele;
      else if(Math.abs(ele - ref) >= 5){ if(ele > ref) dplus += ele - ref; else dminus += ref - ele; ref = ele; }
    }
    pts.push([lat, lon, (ele === null || isNaN(ele)) ? null : ele, dist]);
  });
  const nameN = doc.querySelector('trk > name, metadata > name, rte > name');
  return { pts, km: Math.round(dist * 10) / 10, dplus: Math.round(dplus), dminus: Math.round(dminus),
    eleMin: isFinite(eMin) ? Math.round(eMin) : null, eleMax: isFinite(eMax) ? Math.round(eMax) : null,
    start: pts[0], nom: nameN ? nameN.textContent.trim() : '' };
}
// GPX allégé (3000 points max) pour l'envoi : même tracé, fichier léger
function gpxCompact(t, nom){
  const k = Math.max(1, Math.ceil(t.pts.length / 3000));
  const pts = t.pts.filter((p, i) => i % k === 0 || i === t.pts.length - 1);
  const x = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="BMG Pyrénées Club" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>' + x(nom || t.nom || 'Trace') + '</name><trkseg>' +
    pts.map(p => `<trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}">${p[2] === null ? '' : '<ele>' + p[2].toFixed(1) + '</ele>'}</trkpt>`).join('') + '</trkseg></trk></gpx>';
}
async function onGpxPicked(p){
  const input = document.getElementById(p + '_gpx');
  const info = document.getElementById(p + '_gpx_info');
  const f = input.files && input.files[0];
  delete gpxPending[p];
  if(!f){ info.textContent = ''; return; }
  try{
    const t = parseGpx(await f.text());
    gpxPending[p] = { t, nom: f.name.replace(/\.gpx$/i, '') };
    info.textContent = `${fmtNum(t.km)} km, D+ ${fmtNum(t.dplus)} m${t.eleMax !== null ? ', point haut ' + fmtNum(t.eleMax) + ' m' : ''}. Distance, D+ et point de départ remplis depuis la trace.`;
    const set = (k, v) => { const el = document.getElementById(p + '_' + k); if(el && v !== null && v !== undefined) el.value = v; };
    set('dist', t.km); set('dplus', t.dplus);
    set('lat', Math.round(t.start[0] * 1e5) / 1e5); set('lon', Math.round(t.start[1] * 1e5) / 1e5);
    const ok = document.getElementById(p + '_lieu_ok'); if(ok) ok.textContent = 'Point de départ pris dans la trace';
  }catch(e){
    input.value = '';
    info.innerHTML = `<span style="color:var(--warn)">Trace refusée : ${esc(e.message)}. Choisis un fichier .gpx exporté depuis ton appli (Visorando, Strava, Suunto, IGN…).</span>`;
  }
}
// Envoie la trace choisie dans un formulaire vers la sortie ou l'itinéraire indiqué
async function envoyerGpx(p, cible, id){
  const g = gpxPending[p]; if(!g) return {ok:true};
  const r = await apiPost('gpx_upload', { cible, id, nom: g.nom, contenu: gpxCompact(g.t, g.nom), distance_km: g.t.km, d_plus: g.t.dplus,
    lat: Math.round(g.t.start[0] * 1e5) / 1e5, lon: Math.round(g.t.start[1] * 1e5) / 1e5, remplacer_stats: true });
  delete gpxPending[p];
  return r;
}
function traceFields(p, lien){
  return `<div class="full"><label for="${p}_trace_lien">Lien vers la trace (Visorando, Strava, IGN…)</label><input type="url" id="${p}_trace_lien" value="${esc(lien)}" placeholder="https://"></div>
    <div class="full"><label for="${p}_gpx">Fichier GPX (optionnel)</label><input type="file" id="${p}_gpx" accept=".gpx,application/gpx+xml" onchange="onGpxPicked('${p}')"><div class="status" id="${p}_gpx_info"></div></div>`;
}

async function loadSorties(){
  const [rs, rc] = await Promise.allSettled([apiGet('sorties'), apiGet('catalogue')]);
  if(rs.status === 'fulfilled'){ sortiesCache = rs.value; renderSortiesCards(); }
  else showLoadError('sorties-cards', rs.reason);
  if(rc.status === 'fulfilled'){
    catalogueCache = rc.value;
    const sel = document.getElementById('s_cat');
    if(sel){
      sel.innerHTML = '<option value="">Aucun, sortie libre</option>' + catalogueCache.slice()
        .sort((a,b)=>String(a.titre).localeCompare(String(b.titre),'fr'))
        .map(c => `<option value="${esc(c.catalogue_id)}">${esc(c.titre)}</option>`).join('');
    }
    renderCatalogueList();
  } else showLoadError('catalogue-cards', rc.reason);
}
function inscrit(s){ return Array.isArray(s.inscrits) && s.inscrits.includes(currentUser); }
function renderSortiesCards(){
  const container = document.getElementById('sorties-cards');
  if(!container) return;
  const auj = new Date().toISOString().slice(0,10);
  const list = sortiesCache
    .filter(s => {
      const st = s.statut || 'prevue';
      if(sortieFilter === 'toutes') return true;
      if(sortieFilter === 'miennes') return st === 'prevue' && inscrit(s);
      return st === sortieFilter;
    })
    .sort((a,b) => {
      const k = x => String(x.date || x.date_reelle || '9999');
      return sortieFilter === 'faite' ? k(b).localeCompare(k(a)) : k(a).localeCompare(k(b)) || String(a.titre).localeCompare(String(b.titre),'fr');
    });
  if(!list.length){
    const msg = { prevue: 'Aucune sortie à venir. Planifie la prochaine avec « + Nouvelle sortie » ou depuis un itinéraire ci-dessous.',
      miennes: 'Tu n\'es inscrit à aucune sortie à venir.', faite: 'Aucune sortie faite pour l\'instant.', annulee: 'Aucune sortie annulée.', toutes: 'Aucune sortie.' }[sortieFilter];
    container.innerHTML = `<div class="panel"><div class="empty">${msg}</div></div>`;
    return;
  }
  container.innerHTML = '';
  list.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sortie-card';
    div.tabIndex = 0;
    div.setAttribute('role', 'link');
    div.onclick = () => openSortie(s.sortie_id);
    div.onkeydown = e => { if(e.key === 'Enter') openSortie(s.sortie_id); };
    const n = (s.inscrits || []).length;
    const passee = (s.statut || 'prevue') === 'prevue' && s.date && s.date < auj;
    div.innerHTML = `${dateBlock(s)}
      <div class="sc-body"><h4>${esc(s.titre)}</h4>${metaChips(s)}${s.organisateur ? `<div class="sc-orga">Organisée par ${esc(s.organisateur)}</div>` : ''}</div>
      <div class="sc-side">${inscrit(s) && (s.statut || 'prevue') === 'prevue' ? '<span class="badge moi">Inscrit</span>' : statutBadge(s.statut)}
        ${(s.statut || 'prevue') === 'prevue' ? `<span class="sc-people">${n ? n + ' inscrit' + (n > 1 ? 's' : '') : 'Personne encore'}</span>` : ''}
        ${passee ? '<span class="sc-people" style="color:var(--warn)">Date passée, à clôturer</span>' : ''}</div>`;
    container.appendChild(div);
  });
}
function prefillFromCatalogue(){
  const id = document.getElementById('s_cat').value;
  const info = document.getElementById('s_cat_info');
  const c = catalogueCache.find(x => String(x.catalogue_id) === id);
  if(!c){ info.textContent = ''; return; }
  const set = (k, v) => { const el = document.getElementById(k); if(el && v !== undefined && v !== null) el.value = v; };
  set('s_titre', c.titre); set('s_activite', c.type_activite || 'Randonnée'); set('s_nuitee', c.mode_nuitee || 'Journée');
  set('s_terrain', c.terrain || 'Sentier'); set('s_saison', c.saison || 'Été'); set('s_difficulte', String(c.difficulte || 2));
  set('s_duree', c.duree_jours || 1); set('s_dist', c.distance_km); set('s_dplus', c.d_plus);
  set('s_lieu', c.lieu || ''); set('s_lat', c.lat); set('s_lon', c.lon); set('s_trace_lien', c.trace_lien || '');
  const ok = document.getElementById('s_lieu_ok'); if(ok) ok.textContent = (c.lat !== '' && c.lat !== undefined) ? 'Point de départ repris de l\'itinéraire' : '';
  info.textContent = c.gpx_id ? 'La trace GPX de l\'itinéraire sera reprise automatiquement.' : '';
}
async function createSortie(){
  const g = id => document.getElementById(id).value;
  const body = {
    titre: g('s_titre').trim(), type_activite: g('s_activite'), mode_nuitee: g('s_nuitee'), terrain: g('s_terrain'),
    saison: g('s_saison'), difficulte: g('s_difficulte'), duree_jours: g('s_duree'), distance_km: g('s_dist'), d_plus: g('s_dplus'),
    date: g('s_date'), catalogue_id: g('s_cat'), organisateur: currentUser, trace_lien: g('s_trace_lien').trim(),
    notifier: document.getElementById('s_notifier').checked, ...lieuValues('s'),
  };
  if(!body.titre){ document.getElementById('s_titre').focus(); toast('Donne un titre à la sortie'); return; }
  const btn = document.getElementById('s_submit'); btn.disabled = true; btn.textContent = 'Planification…';
  const r = await apiPost('sortie_add', body);
  if(r && r.ok === false){ btn.disabled = false; btn.textContent = 'Planifier la sortie'; alert(r.error); return; }
  const rg = await envoyerGpx('s', 'sortie', r.sortie_id);
  if(rg && rg.ok === false) alert('Sortie créée, mais la trace GPX n\'a pas été enregistrée : ' + rg.error);
  if(r.agenda_error) alert('Sortie créée, mais l\'agenda BMG n\'a pas pu être mis à jour : ' + r.agenda_error);
  toast(r.mail && /envoyé/.test(r.mail) ? 'Sortie planifiée ✓ Les membres sont prévenus' : 'Sortie planifiée ✓');
  sortieFilter = 'prevue';
  sortiesCache = await apiGet('sorties');
  openSortie(r.sortie_id);
}

let catEditId = null;
async function loadCatalogue(){
  try{ catalogueCache = await apiGet('catalogue'); }
  catch(e){ showLoadError('catalogue-cards', e); return; }
  renderCatalogueList();
}
function renderCatalogueList(){
  const box = document.getElementById('catalogue-cards');
  if(!box) return;
  const q = (document.getElementById('f_q').value || '').toLowerCase();
  const t = document.getElementById('f_type').value;
  const sa = document.getElementById('f_saison').value;
  const d = Number(document.getElementById('f_diff').value) || 0;
  const avecGpx = document.getElementById('f_gpx').checked;
  const list = catalogueCache.filter(c =>
    (!q || [c.titre, c.notes, c.organisateur, c.lieu].map(String).join(' ').toLowerCase().includes(q)) &&
    (!t || c.type_activite === t) && (!sa || c.saison === sa) && (!d || Number(c.difficulte) <= d) && (!avecGpx || c.gpx_id))
    .sort((a,b) => String(a.titre).localeCompare(String(b.titre),'fr'));
  document.getElementById('catalogue-count').textContent = list.length === catalogueCache.length
    ? `${list.length} itinéraire${list.length > 1 ? 's' : ''}` : `${list.length} sur ${catalogueCache.length} itinéraires`;
  if(!list.length){ box.innerHTML = '<div class="panel"><div class="empty">Aucun itinéraire ne correspond. Élargis les filtres ou propose le tien.</div></div>'; return; }
  box.innerHTML = '';
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'idea-card';
    const topo = /^https?:\/\//.test(String(c.topo)) ? `<a href="${esc(c.topo)}" target="_blank" rel="noopener">Voir le topo</a>` : esc(c.topo);
    const lien = /^https?:\/\//.test(String(c.trace_lien)) ? `<a href="${esc(c.trace_lien)}" target="_blank" rel="noopener">Ouvrir la trace</a>` : '';
    const peutModifier = isBureau() || c.cree_par === currentUser || c.organisateur === currentUser || c.cree_par === 'migration';
    div.innerHTML = `<div class="sc-body"><h4>${esc(c.titre)}</h4>${metaChips(c, true)}
      ${c.gpx_id ? '<div class="chips" style="margin-top:6px;"><span class="chip strong">Trace GPX</span></div>' : ''}
      ${c.lieu ? `<div class="sc-orga">Départ : ${esc(c.lieu)}</div>` : ''}
      ${c.organisateur ? `<div class="sc-orga">Proposé par ${esc(c.organisateur)}</div>` : ''}
      ${c.topo ? `<div class="sc-orga">${topo}</div>` : ''}${lien ? `<div class="sc-orga">${lien}</div>` : ''}
      ${c.notes ? `<div class="sc-orga">${esc(String(c.notes).slice(0,200))}</div>` : ''}</div>
      <div class="idea-actions"><button class="small" onclick="planifierDepuisCatalogue('${esc(c.catalogue_id)}')">Planifier</button>
      ${peutModifier ? `<span class="lnk" onclick="editCatalogue('${esc(c.catalogue_id)}')">modifier</span><span class="lnk" onclick="delCatalogue('${esc(c.catalogue_id)}')">supprimer</span>` : ''}</div>`;
    box.appendChild(div);
  });
}
function planifierDepuisCatalogue(id){
  toggleSortieForm(true);
  const sel = document.getElementById('s_cat');
  if(sel){ sel.value = id; prefillFromCatalogue(); }
  setTimeout(() => { const d = document.getElementById('s_date'); if(d) d.focus({preventScroll:true}); }, 400);
}
function catBody(){
  const g = id => document.getElementById(id).value;
  return {
    titre: g('c_titre').trim(), type_activite: g('c_activite'), mode_nuitee: g('c_nuitee'), terrain: g('c_terrain'),
    saison: g('c_saison'), difficulte: g('c_difficulte'), duree_jours: g('c_duree'), distance_km: g('c_dist'), d_plus: g('c_dplus'),
    topo: g('c_topo'), notes: g('c_notes'), trace_lien: g('c_trace_lien').trim(), ...lieuValues('c'),
  };
}
async function saveCatalogue(){
  const body = catBody();
  if(!body.titre){ document.getElementById('c_titre').focus(); toast('Donne un nom à l\'itinéraire'); return; }
  const editing = !!catEditId;
  const r = editing ? await apiPost('catalogue_update', {...body, catalogue_id: catEditId}) : await apiPost('catalogue_add', {...body, organisateur: currentUser});
  if(r && r.ok === false){ alert(r.error); return; }
  const rg = await envoyerGpx('c', 'catalogue', editing ? catEditId : r.catalogue_id);
  if(rg && rg.ok === false) alert('Itinéraire enregistré, mais la trace GPX n\'a pas été enregistrée : ' + rg.error);
  cancelCatalogueEdit();
  toast(editing ? 'Itinéraire mis à jour ✓' : 'Itinéraire ajouté ✓');
  loadCatalogue();
}
function editCatalogue(id){
  const c = catalogueCache.find(x => String(x.catalogue_id) === id);
  if(!c) return;
  catEditId = id;
  const set = (k, v) => { const el = document.getElementById(k); if(el) el.value = (v === undefined || v === null) ? '' : v; };
  set('c_titre', c.titre); set('c_activite', c.type_activite); set('c_nuitee', c.mode_nuitee); set('c_terrain', c.terrain);
  set('c_saison', c.saison || 'Été'); set('c_difficulte', String(c.difficulte || 2)); set('c_duree', c.duree_jours || 1);
  set('c_dist', c.distance_km); set('c_dplus', c.d_plus); set('c_topo', c.topo); set('c_notes', c.notes); set('c_trace_lien', c.trace_lien);
  document.getElementById('c_lieu_wrap').innerHTML = lieuPicker('c', c.lieu || '', c.lat, c.lon);
  document.getElementById('c_gpx_info').textContent = c.gpx_id ? 'Une trace GPX est déjà enregistrée. Choisis un fichier pour la remplacer.' : '';
  document.getElementById('cat_form_title').textContent = 'Modifier l\'itinéraire';
  document.getElementById('c_submit').textContent = 'Enregistrer';
  toggleIdeeForm(true);
}
function cancelCatalogueEdit(){
  catEditId = null;
  delete gpxPending.c;
  ['c_titre','c_dist','c_dplus','c_topo','c_notes','c_trace_lien','c_gpx'].forEach(k => { const el = document.getElementById(k); if(el) el.value = ''; });
  const w = document.getElementById('c_lieu_wrap'); if(w) w.innerHTML = lieuPicker('c', '', '', '');
  const i = document.getElementById('c_gpx_info'); if(i) i.textContent = '';
  const t = document.getElementById('cat_form_title'); if(t) t.textContent = 'Proposer un itinéraire';
  const b = document.getElementById('c_submit'); if(b) b.textContent = 'Ajouter l\'itinéraire';
  toggleIdeeForm(false);
}
async function delCatalogue(id){
  if(!confirm('Supprimer cet itinéraire ? Les sorties déjà planifiées depuis lui sont conservées.')) return;
  const r = await apiPost('catalogue_delete', {catalogue_id: id});
  if(r && r.ok === false){ alert(r.error); return; }
  toast('Itinéraire supprimé ✓');
  loadCatalogue();
}

function renderBilanScreen(){

async function loadBilan(){
  try{ sortiesCache = await apiGet('sorties'); }
  catch(e){ showLoadError('bilan-liste', e); return; }
  const faites = sortiesCache.filter(s => s.statut === 'faite');
  const years = [...new Set(faites.map(s => Number(s.annee)).filter(Boolean))].sort((a,b) => b-a);
  const cur = new Date().getFullYear();
  if(!years.includes(cur)) years.unshift(cur);
  if(!bilanYear) bilanYear = years[0];
  document.getElementById('b_year').innerHTML = years.map(y => `<option value="${y}" ${y===bilanYear?'selected':''}>${y}</option>`).join('');
  const list = faites.filter(s => Number(s.annee) === bilanYear)
    .sort((a,b) => String(a.date_reelle||a.date||'').localeCompare(String(b.date_reelle||b.date||'')) || String(a.titre).localeCompare(String(b.titre),'fr'));
  const sum = k => list.reduce((t,s) => t + (Number(s[k]) || 0), 0);
  document.getElementById('bilan-totaux').innerHTML = `<div class="stats">
    <div class="stat"><div class="stat-n">${list.length}</div><div class="stat-l">Sorties</div></div>
    <div class="stat"><div class="stat-n">${fmtNum(Math.round(sum('distance_km')*10)/10)} km</div><div class="stat-l">Distance</div></div>
    <div class="stat"><div class="stat-n">${fmtNum(sum('d_plus'))} m</div><div class="stat-l">Dénivelé +</div></div>
    <div class="stat"><div class="stat-n">${sum('duree_jours')}</div><div class="stat-l">Jours en montagne</div></div></div>`;
  const box = document.getElementById('bilan-liste');
  if(!list.length){ box.innerHTML = '<div class="panel"><div class="empty">Aucune sortie faite cette année.</div></div>'; return; }
  box.innerHTML = '<div class="panel">' + list.map(s => `<div class="item-row"><span>${esc(s.titre)} <span class="note">${esc(s.date_reelle || s.date || '')}${s.nb_participants!==''?' · '+esc(s.nb_participants)+' participants':''}${s.notes_bilan?' · '+esc(s.notes_bilan):''}</span></span>
    <span>${s.distance_km!==''?esc(fmtNum(s.distance_km))+' km':''} ${s.d_plus!==''?'· +'+esc(fmtNum(s.d_plus))+' m':''}</span></div>`).join('') + '</div>';
}

// ================= MÉTÉO (Open-Meteo, sans clé) =================
const WX = {0:['☀️','Ciel dégagé'],1:['🌤️','Plutôt dégagé'],2:['⛅','Éclaircies'],3:['☁️','Couvert'],45:['🌫️','Brouillard'],48:['🌫️','Brouillard givrant'],
  51:['🌦️','Bruine faible'],53:['🌦️','Bruine'],55:['🌧️','Bruine forte'],56:['🌧️','Bruine verglaçante'],57:['🌧️','Bruine verglaçante'],
  61:['🌦️','Pluie faible'],63:['🌧️','Pluie'],65:['🌧️','Pluie forte'],66:['🌧️','Pluie verglaçante'],67:['🌧️','Pluie verglaçante'],
  71:['🌨️','Neige faible'],73:['🌨️','Neige'],75:['❄️','Neige forte'],77:['🌨️','Grains de neige'],80:['🌦️','Averses'],81:['🌧️','Averses'],82:['⛈️','Fortes averses'],
  85:['🌨️','Averses de neige'],86:['❄️','Fortes averses de neige'],95:['⛈️','Orage'],96:['⛈️','Orage et grêle'],99:['⛈️','Orage et grêle']};
function isoJour(d){ const z = n => String(n).padStart(2,'0'); return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()); }
function dateIso(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||'')); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
async function renderMeteo(){
  const cs = currentSortie;
  const panel = document.getElementById('wx-panel'), box = document.getElementById('wx');
  if(!panel) return;
  const st = cs.statut || 'prevue';
  const d0 = dateIso(cs.date);
  const auj = new Date(); auj.setHours(0,0,0,0);
  const jours = Math.max(1, Number(cs.duree_jours) || 1);
  if(st !== 'prevue' || !d0){ panel.style.display = 'none'; return; }
  const fin = new Date(d0); fin.setDate(fin.getDate() + jours - 1);
  if(fin < auj){ panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  if(cs.lat === '' || cs.lat === undefined || cs.lon === '' || cs.lon === undefined){
    box.innerHTML = `<div class="empty">Pas de point de départ : ${canManage(cs) ? 'indique le lieu dans « Modifier la sortie » ou importe une trace GPX' : 'l\'organisateur peut ajouter un lieu ou une trace'} pour voir la météo.</div>`;
    return;
  }
  const max = new Date(auj); max.setDate(max.getDate() + 15);
  if(d0 > max){
    const dispo = new Date(d0); dispo.setDate(dispo.getDate() - 15);
    box.innerHTML = `<div class="empty">Les prévisions apparaîtront ici à partir du ${dispo.toLocaleDateString('fr-FR', {day:'numeric', month:'long'})}, 15 jours avant la sortie.</div>`;
    return;
  }
  const debut = d0 < auj ? auj : d0;
  const finMax = fin > max ? max : fin;
  box.innerHTML = '<div class="status">Chargement des prévisions…</div>';
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${cs.lat}&longitude=${cs.lon}&timezone=Europe%2FParis` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max` +
      `&hourly=freezing_level_height&start_date=${isoJour(debut)}&end_date=${isoJour(finMax)}`;
    const d = await (await fetch(url)).json();
    if(!d.daily) throw new Error(d.reason || 'réponse vide');
    const iso0 = {};
    (d.hourly && d.hourly.time || []).forEach((t, i) => { if(t.endsWith('T13:00')) iso0[t.slice(0,10)] = d.hourly.freezing_level_height[i]; });
    box.innerHTML = '<div class="wx">' + d.daily.time.map((t, i) => {
      const code = d.daily.weather_code[i];
      const [ico, lbl] = WX[code] || ['·', 'Indéterminé'];
      const cls = code >= 95 ? 'storm' : (code >= 61 || (d.daily.wind_gusts_10m_max[i] || 0) >= 70) ? 'bad' : '';
      const prob = d.daily.precipitation_probability_max ? d.daily.precipitation_probability_max[i] : null;
      return `<div class="wx-day ${cls}">
        <div class="wx-date">${dateIso(t).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'short'})}</div>
        <div class="wx-ico" aria-hidden="true">${ico}</div><div class="wx-lbl">${lbl}</div>
        <div class="wx-t">${Math.round(d.daily.temperature_2m_max[i])}° <span>/ ${Math.round(d.daily.temperature_2m_min[i])}°</span></div>
        <div class="wx-l">Pluie ${fmtNum(d.daily.precipitation_sum[i])} mm${prob !== null ? ' (' + prob + ' %)' : ''}</div>
        <div class="wx-l">Vent ${Math.round(d.daily.wind_speed_10m_max[i])}&nbsp;km/h, rafales ${Math.round(d.daily.wind_gusts_10m_max[i])}&nbsp;km/h</div>
        ${iso0[t] !== undefined && iso0[t] !== null ? `<div class="wx-l">Isotherme 0&nbsp;°C : ${fmtNum(Math.round(iso0[t] / 50) * 50)}&nbsp;m</div>` : ''}
      </div>`;
    }).join('') + '</div>' +
    `<div class="wx-src">Prévisions Open-Meteo pour ${esc(cs.lieu || 'le point de départ')}${d.elevation ? ' (altitude ' + fmtNum(Math.round(d.elevation)) + ' m)' : ''}. Elles changent jusqu'au départ : regarde-les la veille.</div>`;
  }catch(e){
    box.innerHTML = '<div class="empty">Prévisions indisponibles pour le moment. Réessaie plus tard.</div>';
  }
}

let leafletPromise = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletPromise) return leafletPromise;
  leafletPromise = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet';
    css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    js.onload = () => res(); js.onerror = () => { leafletPromise = null; rej(new Error('carte indisponible')); };
    document.head.appendChild(js);
  });
  return leafletPromise;
}
async function getGpx(id){
  if(gpxCache[id]) return gpxCache[id];
  const r = await apiGet('gpx', {id});
  if(!r || !r.contenu) throw new Error('trace introuvable');
  gpxCache[id] = { nom: r.nom, contenu: r.contenu, t: parseGpx(r.contenu) };
  return gpxCache[id];
}
function traceManageHtml(cs){
  if(!canManage(cs) || (cs.statut || 'prevue') === 'faite') return '';
  return `<details class="manage" ${!cs.gpx_id && !cs.trace_lien ? 'open' : ''}><summary>${cs.gpx_id || cs.trace_lien ? 'Modifier la trace' : 'Ajouter une trace'}</summary>
    <div class="grid" style="margin-top:14px;">
      <div class="full"><label for="t_gpx">${cs.gpx_id ? 'Remplacer le fichier GPX' : 'Fichier GPX'}</label><input type="file" id="t_gpx" accept=".gpx,application/gpx+xml" onchange="onGpxPicked('t')"><div class="status" id="t_gpx_info"></div></div>
      <div class="full"><label for="t_trace_lien">Lien vers la trace (Visorando, Strava, IGN…)</label><input type="url" id="t_trace_lien" value="${esc(cs.trace_lien)}" placeholder="https://"></div>
      <input type="hidden" id="t_dist"><input type="hidden" id="t_dplus"><input type="hidden" id="t_lat"><input type="hidden" id="t_lon">
      <div class="full toolbar"><button onclick="saveTrace()">Enregistrer la trace</button>${cs.gpx_id ? '<span class="lnk" onclick="removeGpx()">Retirer le fichier GPX</span>' : ''}</div>
    </div></details>`;
}
async function renderTrace(){
  const cs = currentSortie;
  const box = document.getElementById('trace');
  if(!box) return;
  const lien = /^https?:\/\//.test(String(cs.trace_lien)) ? `<a class="lnk" style="margin-left:0" href="${esc(cs.trace_lien)}" target="_blank" rel="noopener">Ouvrir la trace en ligne</a>` : '';
  if(!cs.gpx_id){
    box.innerHTML = (lien ? `<div class="toolbar">${lien}</div>` : '<div class="empty">Pas encore de trace pour cette sortie.</div>') + traceManageHtml(cs);
    return;
  }
  box.innerHTML = `<div class="map" id="map" role="img" aria-label="Carte de la trace"></div>
    <div class="profile" id="profile"></div><div class="profile-read" id="profile-read"></div>
    <div class="tstats" id="tstats"></div>
    <div class="toolbar"><button class="outline small" onclick="telechargerGpx()">Télécharger le GPX</button>${lien}</div>` + traceManageHtml(cs);
  let g;
  try{ g = await getGpx(cs.gpx_id); }
  catch(e){ document.getElementById('map').outerHTML = '<div class="warn">La trace GPX n\'a pas pu être chargée.</div>'; return; }
  const t = g.t;
  document.getElementById('tstats').innerHTML = [
    [fmtNum(t.km) + ' km', 'distance'], ['+' + fmtNum(t.dplus) + ' m', 'dénivelé positif'], ['−' + fmtNum(t.dminus) + ' m', 'dénivelé négatif'],
    t.eleMax !== null ? [fmtNum(t.eleMax) + ' m', 'point haut'] : null, t.eleMin !== null ? [fmtNum(t.eleMin) + ' m', 'point bas'] : null
  ].filter(Boolean).map(([v, l]) => `<div class="tstat"><b>${v}</b><span>${l}</span></div>`).join('');
  drawProfile(t);
  try{
    await loadLeaflet();
    if(!document.getElementById('map')) return;
    const map = L.map('map', {scrollWheelZoom:false, tap:true});
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {maxZoom:17, attribution:'Carte © OpenTopoMap (CC-BY-SA), données © OpenStreetMap'}).addTo(map);
    const line = L.polyline(t.pts.map(p => [p[0], p[1]]), {color:'#2E6B2A', weight:4, opacity:.9}).addTo(map);
    L.circleMarker([t.pts[0][0], t.pts[0][1]], {radius:7, color:'#0A1E1E', weight:2, fillColor:'#5FAD56', fillOpacity:1}).addTo(map).bindTooltip('Départ');
    const last = t.pts[t.pts.length-1];
    if(haversine(t.pts[0], last) > 0.2) L.circleMarker([last[0], last[1]], {radius:6, color:'#0A1E1E', weight:2, fillColor:'#fff', fillOpacity:1}).addTo(map).bindTooltip('Arrivée');
    window._cursor = L.circleMarker([t.pts[0][0], t.pts[0][1]], {radius:6, color:'#fff', weight:2, fillColor:'#B3261E', opacity:0, fillOpacity:0}).addTo(map);
    map.fitBounds(line.getBounds(), {padding:[18,18]});
    window._map = map;
  }catch(e){
    const m = document.getElementById('map'); if(m) m.outerHTML = '<div class="empty">Carte indisponible hors connexion. Le profil et le fichier restent accessibles.</div>';
  }
}
// Profil altimétrique : glisser le doigt dessus déplace le repère sur la carte
function drawProfile(t){
  const el = document.getElementById('profile');
  const pts = t.pts.filter(p => p[2] !== null);
  if(!el || pts.length < 2){ if(el) el.innerHTML = ''; return; }
  const W = Math.max(300, Math.round(el.clientWidth || 640)), H = W < 520 ? 150 : 180, padL = 46, padB = 24, padT = 10, padR = 8;
  const dMax = pts[pts.length-1][3] || 1;
  const eMin = Math.min(...pts.map(p => p[2])), eMax = Math.max(...pts.map(p => p[2]));
  const lo = Math.floor((eMin - 20) / 100) * 100, hi = Math.ceil((eMax + 20) / 100) * 100;
  const X = d => padL + (d / dMax) * (W - padL - padR);
  const Y = e => padT + (1 - (e - lo) / (hi - lo || 1)) * (H - padT - padB);
  const k = Math.max(1, Math.ceil(pts.length / 600));
  const sample = pts.filter((p, i) => i % k === 0 || i === pts.length - 1);
  const line = sample.map((p, i) => (i ? 'L' : 'M') + X(p[3]).toFixed(1) + ' ' + Y(p[2]).toFixed(1)).join(' ');
  const area = line + ` L${X(dMax).toFixed(1)} ${H - padB} L${padL} ${H - padB} Z`;
  const stepE = (hi - lo) > 1200 ? 500 : (hi - lo) > 500 ? 200 : 100;
  let grid = '';
  for(let e = Math.ceil(lo / stepE) * stepE; e <= hi; e += stepE){
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${Y(e)}" y2="${Y(e)}" stroke="#D5D8CF" stroke-width="1"/><text x="${padL - 6}" y="${Y(e) + 4}" text-anchor="end" font-size="12" fill="#4F5557">${e}</text>`;
  }
  const stepD = (dMax / (W / 90)) > 5 ? 10 : (dMax / (W / 90)) > 2 ? 5 : (dMax / (W / 90)) > 1 ? 2 : 1;
  for(let d = 0; d <= dMax + 0.001; d += stepD){
    grid += `<text x="${X(d)}" y="${H - 6}" text-anchor="${d === 0 ? 'start' : 'middle'}" font-size="12" fill="#4F5557">${d} km</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Profil altimétrique, de ${fmtNum(Math.round(eMin))} à ${fmtNum(Math.round(eMax))} mètres">
    ${grid}<path d="${area}" fill="#E7F2E4"/><path d="${line}" fill="none" stroke="#2E6B2A" stroke-width="2"/>
    <line id="pf-x" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="#0A1E1E" stroke-width="1" opacity="0"/>
    <circle id="pf-dot" r="4.5" fill="#B3261E" stroke="#fff" stroke-width="1.5" opacity="0"/></svg>`;
  const svg = el.querySelector('svg');
  const read = document.getElementById('profile-read');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const x = ((ev.clientX - r.left) / r.width) * W;
    const d = Math.max(0, Math.min(dMax, ((x - padL) / (W - padL - padR)) * dMax));
    let i = 0, lo2 = 0, hi2 = pts.length - 1;
    while(lo2 < hi2){ const m = (lo2 + hi2) >> 1; if(pts[m][3] < d) lo2 = m + 1; else hi2 = m; }
    i = lo2;
    const p = pts[i];
    svg.querySelector('#pf-x').setAttribute('x1', X(p[3])); svg.querySelector('#pf-x').setAttribute('x2', X(p[3]));
    svg.querySelector('#pf-x').setAttribute('opacity', .5);
    const dot = svg.querySelector('#pf-dot'); dot.setAttribute('cx', X(p[3])); dot.setAttribute('cy', Y(p[2])); dot.setAttribute('opacity', 1);
    read.textContent = `Km ${fmtNum(Math.round(p[3] * 10) / 10)}, altitude ${fmtNum(Math.round(p[2]))} m`;
    if(window._cursor){ window._cursor.setLatLng([p[0], p[1]]); window._cursor.setStyle({opacity:1, fillOpacity:1}); }
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', ev => { svg.setPointerCapture && svg.setPointerCapture(ev.pointerId); move(ev); });
  read.textContent = matchMedia('(hover: hover)').matches ? 'Survole le profil pour situer chaque point sur la carte.' : 'Glisse le doigt sur le profil pour situer chaque point sur la carte.';
}

        <div class="car-head"><div><div class="car-who">${esc(v.conducteur)}${estMoi ? ' (toi)' : ''}</div>

// ---- moteur (identique aux versions précédentes) ----
function nearestConfort(items, target){
  const order = ['Sommaire','Confortable','Luxe'];
  const ti = order.indexOf(target);
  let best = null, bestDist = 99;
  for(const it of items){ const d = Math.abs(order.indexOf(it.confort) - ti); if(d < bestDist){ bestDist = d; best = it; } }
  return best;
}
function bySaison(items, saison){
  const exact = items.filter(i => i.saison === saison);
  if(exact.length) return exact;
  const multi = items.filter(i => i.saison === 'Multi');
  return multi.length ? multi : items;
}
function lightest(items){ return items.length ? items.reduce((a,b)=> a.poids<=b.poids?a:b) : null; }
function heaviest(items){ return items.length ? items.reduce((a,b)=> a.poids>=b.poids?a:b) : null; }
function pick(sc, saison, confort){ if(!sc||!sc.length) return null; return nearestConfort(bySaison(sc, saison), confort); }
function pickWithIndispensables(sc, saison, confort){
  if(!sc || !sc.length) return [];
  const seasonPool = bySaison(sc, saison);
  const indispensables = seasonPool.filter(i => i.confort === 'Indispensable');
  const normal = seasonPool.filter(i => i.confort !== 'Indispensable');
  const result = [];
  if(normal.length) result.push(nearestConfort(normal, confort));
  const seenNoms = new Set(result.map(r => r.nom));
  indispensables.forEach(i => { if(!seenNoms.has(i.nom)){ result.push(i); seenNoms.add(i.nom); } });
  return result;
}

function computeKit(catalog, params){
  const {nuitee, terrain, saison, confort, duree, difficulte, isCourse, autonomieRepas} = params;
  let individualWeight = 0;
  const sections = {};
  const collectifProposals = [];
  const warnings = [];
  function checkEmpty(l, a){ if(!a || !a.length) warnings.push(l); }

  if(nuitee !== 'Journée'){
    const couchage = [];
    if(nuitee === 'Refuge'){
      const duvetPool = bySaison(catalog.couchage['Duvet']||[], saison);
      const normalDuvet = duvetPool.filter(i => i.confort !== 'Indispensable');
      const indispDuvet = duvetPool.filter(i => i.confort === 'Indispensable');
      const item = lightest(normalDuvet);
      checkEmpty('Duvet', duvetPool);
      if(item){ couchage.push({label:item.nom, poids:item.poids, note:'le plus léger'}); individualWeight += item.poids; }
      indispDuvet.forEach(d => { couchage.push({label:d.nom, poids:d.poids}); individualWeight += d.poids; });
    } else {
      checkEmpty('Tente', catalog.couchage['Tente']);
      checkEmpty('Matelas', catalog.couchage['Matelas']);
      checkEmpty('Duvet', catalog.couchage['Duvet']);
      pickWithIndispensables(catalog.couchage['Tente'], saison, confort).forEach(t => collectifProposals.push({label:t.nom, poids:t.poids, subcat:'Tente'}));
      pickWithIndispensables(catalog.couchage['Matelas'], saison, confort).forEach(m => { couchage.push({label:m.nom, poids:m.poids}); individualWeight += m.poids; });
      pickWithIndispensables(catalog.couchage['Duvet'], saison, confort).forEach(d => { couchage.push({label:d.nom, poids:d.poids}); individualWeight += d.poids; });
      couchage.push({label:'Sac étanche / sursac', poids:150, note:'estimé'}); individualWeight += 150;
    }
    if(confort === 'Luxe'){
      const bonus = pick(catalog.couchage['Bonus'], saison, confort);
      if(bonus){ couchage.push({label:bonus.nom, poids:bonus.poids, note:'bonus'}); individualWeight += bonus.poids; }
    }
    sections['Couchage'] = couchage;
  }

  const vet = [];
  checkEmpty('Couche protectrice', catalog.vetements['Couche protectrice']);
  pickWithIndispensables(catalog.vetements['Couche protectrice'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  checkEmpty('Couche isolante', catalog.vetements['Couche isolante']);
  pickWithIndispensables(catalog.vetements['Couche isolante'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  if(saison === 'Froide'){
    bySaison(catalog.vetements['Sous-couche chaude']||[], saison).forEach(i => { vet.push({label:i.nom, poids:i.poids, note:'base layer'}); individualWeight += i.poids; });
  }
  checkEmpty('Couche transpirante', catalog.vetements['Couche transpirante']);
  pickWithIndispensables(catalog.vetements['Couche transpirante'], saison, confort).forEach((it, idx) => { vet.push({label:it.nom, poids:it.poids, note:(idx===0 && duree>=2)?'+1 rechange conseillé':''}); individualWeight += it.poids; });
  checkEmpty('Pantalons et shorts', catalog.vetements['Pantalons et shorts']);
  pickWithIndispensables(catalog.vetements['Pantalons et shorts'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  const extremites = bySaison(catalog.vetements['Extrémités']||[], saison);
  const seen = {};
  extremites.forEach(i => {
    if(seen[i.nom]) return; seen[i.nom] = true;
    const chosen = nearestConfort(extremites.filter(x=>x.nom===i.nom), confort);
    vet.push({label:chosen.nom, poids:chosen.poids}); individualWeight += chosen.poids;
  });
  if(nuitee !== 'Journée' && nuitee !== 'Refuge'){
    vet.push({label:'Vêtement de rechange sec', poids:150, note:'estimé'}); individualWeight += 150;
  }
  sections['Vêtements'] = vet;

  const eq = [];
  const isCourseVal = isCourse;
  if(autonomieRepas){
    checkEmpty('Cuisine', catalog.equipements['Cuisine']);
    const cuisineItems = bySaison(catalog.equipements['Cuisine']||[], saison);
    const seenC = {};
    cuisineItems.forEach(i => {
      if(seenC[i.nom]) return; seenC[i.nom] = true;
      const variants = cuisineItems.filter(x=>x.nom===i.nom);
      collectifProposals.push({label: nearestConfort(variants, confort).nom, poids: nearestConfort(variants, confort).poids, subcat:'Cuisine'});
    });
  }
  checkEmpty('Survie', catalog.equipements['Survie']);
  pickWithIndispensables(catalog.equipements['Survie'], saison, confort).forEach(s => { eq.push({label:s.nom, poids:s.poids}); individualWeight += s.poids; });
  checkEmpty('Hydratation', catalog.equipements['Hydratation']);
  pickWithIndispensables(catalog.equipements['Hydratation'], saison, confort).forEach(hydra => {
    eq.push({label:hydra.nom, poids:hydra.poids}); individualWeight += hydra.poids;
    if(duree >= 2 || saison === 'Chaude'){ eq.push({label:hydra.nom, poids:hydra.poids, note:'unité supplémentaire'}); individualWeight += hydra.poids; }
  });
  checkEmpty('Hygiène et nuit', catalog.equipements['Hygiène et nuit']);
  pickWithIndispensables(catalog.equipements['Hygiène et nuit'], saison, confort).forEach(it => { eq.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  checkEmpty('Sac', catalog.equipements['Sac']);
  const sacPool = bySaison(catalog.equipements['Sac']||[], saison);
  const sac = (isCourseVal || nuitee === 'Journée') ? lightest(sacPool) : heaviest(sacPool);
  if(sac){ eq.push({label:sac.nom, poids:sac.poids}); individualWeight += sac.poids; }
  sections['Équipements'] = eq;

  const nut = [];
  nut.push({label:'Barres énergétiques / fruits secs', poids:150*duree, note:`${duree}j × 150g`}); individualWeight += 150*duree;
  if(isCourse){ nut.push({label:'Gels énergétiques (x4)', poids:160, note:'estimé'}); individualWeight += 160; }
  if(!autonomieRepas && nuitee === 'Journée'){ nut.push({label:'Pique-nique complet', poids:500, note:'estimé'}); individualWeight += 500; }
  if(autonomieRepas){
    nut.push({label:'Repas du soir (lyophilisé)', poids:150*duree, note:`${duree} nuit(s)`}); individualWeight += 150*duree;
    nut.push({label:'Petit-déjeuner', poids:100*duree, note:`${duree}j`}); individualWeight += 100*duree;
  }
  sections['Nutrition'] = nut;

  const divers = [];
  divers.push({label:'Trousse de secours de base', poids:150, note:'estimé'}); individualWeight += 150;
  divers.push({label:'Crème solaire', poids:100, note:'estimé'}); individualWeight += 100;
  const lunPoids = (terrain==='Neige'||terrain==='Glacier') ? 60 : 30;
  divers.push({label:(terrain==='Neige'||terrain==='Glacier')?'Lunettes de glacier (cat.4)':'Lunettes de soleil', poids:lunPoids, note:'estimé'}); individualWeight += lunPoids;
  divers.push({label:'Batterie externe', poids:200, note:'estimé'}); individualWeight += 200;
  sections['Sécurité & divers'] = divers;

  const tech = [];
  function addTech(label, note){
    const poids = TECH_POIDS[label] || 0;
    if(TECH_COLLECTIF.includes(label)){
      collectifProposals.push({label, poids, subcat:'Technique', note:'estimé'});
    } else {
      tech.push({label, poids, note:(note?note+' — ':'')+'estimé'}); individualWeight += poids;
    }
  }
  if(terrain === 'Glacier'){
    addTech('Crampons (paire)'); addTech('Piolet'); addTech('Casque alpi'); addTech('Baudrier');
    addTech("Corde d'encordement (partagée, ~60m/9mm)"); addTech('Broches à glace (kit)');
    if(difficulte >= 4){ addTech('DVA'); addTech('Pelle à neige'); addTech('Sonde avalanche'); }
  } else if(terrain === 'Rocher/Neige technique'){
    addTech('Crampons (paire)'); addTech('Piolet ou bâtons renforcés'); addTech('Casque alpi');
  } else if(terrain === 'Neige'){
    addTech('Raquettes à neige (paire)'); addTech('Bâtons (paire)'); addTech('Guêtres');
    if(difficulte >= 4){ addTech('DVA'); addTech('Pelle à neige'); addTech('Sonde avalanche'); }
  } else if(terrain === 'Route'){
    addTech('Casque vélo'); addTech('Kit de réparation / crevaison');
  } else if(terrain === 'Eau'){
    addTech('Matériel pêche / vêtements étanches');
  }
  if(difficulte >= 4) addTech('GPS (si pas de smartphone fiable)', 'sécurité');
  if(tech.length) sections['Matériel technique'] = tech;

  return { sections, individualWeight, collectifProposals, warnings };
}

async function computeAllKits(presentList){
  let present = presentList;
  if(!present){
    const parts = await apiGet('participants', {sortie_id: currentSortieId});
    present = parts.filter(p => String(p.present) === 'true' || p.present === true).map(p => p.pseudo);
  }
  kitCache = {};
  const params = {
    nuitee: currentSortie.mode_nuitee, terrain: currentSortie.terrain, saison: saisonEquip(currentSortie.saison),
    confort: 'Confortable', duree: Number(currentSortie.duree_jours) || 1, difficulte: Number(currentSortie.difficulte) || 1,
    isCourse: ['Trail','Course à pied'].includes(currentSortie.type_activite),
    autonomieRepas: ['Bivouac','Cabane','Mixte'].includes(currentSortie.mode_nuitee),
  };
  const invs = await Promise.all(present.map(pseudo => apiGet('inventaire', {pseudo}).catch(() => [])));
  present.forEach((pseudo, i) => { kitCache[pseudo] = computeKit(catalogFromItems(invs[i]), params); });
  await renderCollectifAndRecap(present);
}

async function renderCollectifAndRecap(present){
  const bySubcat = {};
  present.forEach(pseudo => {
    (kitCache[pseudo].collectifProposals || []).forEach(p => {
      if(!bySubcat[p.subcat]) bySubcat[p.subcat] = [];
      bySubcat[p.subcat].push(p);
    });
  });
  const groupCollectifItems = [];
  for(const subcat of Object.keys(bySubcat)){
    const uniqueByLabel = {};
    bySubcat[subcat].forEach(p => { if(!uniqueByLabel[p.label] || p.poids < uniqueByLabel[p.label].poids) uniqueByLabel[p.label] = p; });
    Object.values(uniqueByLabel).forEach(p => groupCollectifItems.push(p));
  }

  const existingAttrib = await apiGet('attribution', {sortie_id: currentSortieId});
  const attribMap = {};
  existingAttrib.forEach(a => attribMap[a.objet] = a.pseudo_porteur);

  const container = document.getElementById('collectif-list');
  if(!container) return;
  container.innerHTML = '';
  if(!groupCollectifItems.length){ container.innerHTML = '<div class="empty">Aucun matériel collectif détecté pour cette sortie.</div>'; }
  groupCollectifItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'collectif-row';
    const assigned = attribMap[item.label] || '';
    const options = present.map(p => `<option value="${p}" ${p===assigned?'selected':''}>${p}</option>`).join('');
    row.innerHTML = `<span>${item.label} <span class="note">${item.poids}g${item.note?(' — '+item.note):''}</span></span>
      <select class="mini" onchange="reassign('${item.label.replace(/'/g,"\\'")}', ${item.poids}, this.value)">${options}</select>`;
    container.appendChild(row);
  });

  window._groupCollectifItems = groupCollectifItems;
  renderRecap(present, groupCollectifItems, attribMap);
}

async function reassign(objet, poids, pseudo){
  await apiPost('attribution_set', {sortie_id: currentSortieId, objet, poids_g: poids, pseudo_porteur: pseudo});
  await computeAllKits(presentCache);
}

async function autoAssign(){
  const items = (window._groupCollectifItems || []).slice().sort((a,b) => b.poids - a.poids);
  const present = presentCache.slice();
  if(!present.length) return;
  const running = {};
  present.forEach(p => running[p] = kitCache[p] ? kitCache[p].individualWeight : 0);
  for(const item of items){
    let minP = present[0];
    present.forEach(p => { if(running[p] < running[minP]) minP = p; });
    await apiPost('attribution_set', {sortie_id: currentSortieId, objet: item.label, poids_g: item.poids, pseudo_porteur: minP});
    running[minP] += item.poids;
  }
  await computeAllKits(presentCache);
  toast('Matériel collectif réparti ✓');
}

function renderRecap(present, groupCollectifItems, attribMap){
  const container = document.getElementById('recap-list');
  if(!container) return;
  container.innerHTML = '';
  let grandTotal = 0;
  present.forEach(pseudo => {
    const kit = kitCache[pseudo];
    if(!kit) return;
    const collectifCarried = groupCollectifItems.filter(it => attribMap[it.label] === pseudo);
    const collectifWeight = collectifCarried.reduce((s,i) => s + i.poids, 0);
    const total = kit.individualWeight + collectifWeight;
    grandTotal += total;
    const div = document.createElement('div');
    div.className = 'recap-card';
    let sectionsHtml = Object.entries(kit.sections).map(([name, items]) => {
      if(!items.length) return '';
      return `<div class="subcat-label">${name}</div>` + items.map(i => `<div class="item-row"><span>${i.label}${i.note?` <span class="note">(${i.note})</span>`:''}</span><span>${i.poids}g</span></div>`).join('');
    }).join('');
    const collectifHtml = collectifCarried.length ? `<div class="subcat-label">Matériel collectif porté</div>` +
      collectifCarried.map(i => `<div class="item-row"><span>${i.label}</span><span>${i.poids}g</span></div>`).join('') : '';
    const warnHtml = kit.warnings.length ? `<div class="warn">Inventaire incomplet pour : ${kit.warnings.join(', ')}</div>` : '';
    div.innerHTML = `<h4>${pseudo} <span>${(total/1000).toFixed(2)} kg</span></h4>${sectionsHtml}${collectifHtml}${warnHtml}`;
    container.appendChild(div);
  });
  document.getElementById('detail-weightbar').innerHTML = present.length
    ? `<div><div class="label">Poids total groupe</div><div class="big">${(grandTotal/1000).toFixed(2)} kg</div></div><div class="note">${present.length} participant(s)</div>`
    : '<div class="empty">Aucun inscrit pour l\'instant.</div>';
}

// ================= Repas =================
async function refreshRepas(){
  const repas = await apiGet('repas', {sortie_id: currentSortieId});
  const container = document.getElementById('repas-list');
  if(!container) return;
  container.innerHTML = '';
  const byJour = {};
  repas.forEach(r => { (byJour[r.jour] = byJour[r.jour] || []).push(r); });
  Object.keys(byJour).sort((a,b)=>a-b).forEach(jour => {
    const div = document.createElement('div');
    div.className = 'repas-day';
    let html = `<h5>Jour ${jour}</h5>`;
    byJour[jour].forEach(r => {
      html += `<div class="repas-item"><span>${r.moment} — ${r.plat} <span class="note">(${r.responsable}, ${r.portions} pers.)</span></span>
        <span class="lnk" onclick="delRepas(${jour},'${r.moment}','${r.plat.replace(/'/g,"\\'")}','${r.responsable}')">supprimer</span></div>`;
    });
    div.innerHTML = html;
    container.appendChild(div);
  });
  if(!repas.length) container.innerHTML = '<div class="empty">Aucun repas renseigné.</div>';
}
async function addRepas(){
  const body = {
    sortie_id: currentSortieId,
    jour: document.getElementById('r_jour').value,
    moment: document.getElementById('r_moment').value,
    plat: document.getElementById('r_plat').value,
    responsable: document.getElementById('r_resp').value || currentUser,
    portions: document.getElementById('r_portions').value,
  };
  if(!body.plat) return;
  await apiPost('repas_add', body);
  refreshRepas();
}
async function delRepas(jour, moment, plat, responsable){
  await apiPost('repas_delete', {sortie_id: currentSortieId, jour, moment, plat, responsable});
  refreshRepas();
}

boot();
</script>
