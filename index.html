<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>BMG — Sorties &amp; Équipement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F0; --card:#fff; --line:#D5D8CF; --ink:#111; --muted:#4F5557;
    --green:#5FAD56; --green-dark:#2E6B2A; --green-soft:#E7F2E4; --warn:#B3261E;
  }
  *{box-sizing:border-box;}
  html{font-size:16px;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',Arial,sans-serif; font-size:15px; line-height:1.5;}
  a{color:var(--ink);}
  h1,h2,h3,h4,h5{margin:0;}

  /* ---- En-tête ---- */
  header.top{background:#fff; border-bottom:1px solid var(--ink); position:sticky; top:0; z-index:20;}
  .top-in{max-width:1040px; margin:0 auto; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand h1{font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:32px; line-height:1; letter-spacing:-0.01em;}
  .logo{height:68px; width:auto; display:block;}
  .top-right{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .user{font-size:15px; color:var(--muted);}
  .user b{color:var(--ink); font-weight:600;}
  .wrap{max-width:1040px; margin:0 auto; padding:8px 24px 72px;}
  .sub{color:var(--muted); font-size:14px; margin:16px 0;}

  /* ---- Onglets ---- */
  .tabs{display:flex; gap:4px; margin:24px 0 28px; border-bottom:2px solid var(--line); overflow-x:auto;}
  .tab{background:none; color:var(--muted); border:none; border-bottom:4px solid transparent; margin-bottom:-2px; border-radius:0; padding:12px 20px; font-size:16px; font-weight:600; white-space:nowrap;}
  .tab:hover{background:rgba(0,0,0,.04); color:var(--ink);}
  .tab.active{color:var(--ink); border-bottom-color:var(--green); background:none;}

  /* ---- Titres ---- */
  h2.page-title{font-family:'Stack Sans Headline',sans-serif; font-weight:300; font-size:36px; line-height:1.1; margin:4px 0 6px;}
  .page-sub{color:var(--muted); font-size:15px; margin:0 0 24px; max-width:640px;}
  h3{font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:18px; line-height:1.25; margin:0 0 16px; padding-left:12px; border-left:5px solid var(--green);}
  h4{font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:16px; margin:0 0 6px;}
  h5{font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 4px;}

  /* ---- Cartes / panneaux ---- */
  .panel{background:var(--card); border:1px solid var(--line); padding:24px; margin-bottom:24px;}
  #identity-panel{max-width:520px; margin-top:24px;}
  .actionbar{margin:0 0 20px;}
  .backbar{margin:24px 0 8px;}
  .btnrow{display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .btnrow h3{margin:0;}

  /* ---- Formulaires ---- */
  label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px;}
  select, input[type=number], input[type=text], input[type=date]{width:100%; padding:10px 12px; border:1px solid #8E948E; border-radius:3px; background:#fff; color:var(--ink); font-family:inherit; font-size:15px; -webkit-appearance:none; appearance:none;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='black'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:34px; cursor:pointer;}
  select:focus, input:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(95,173,86,.4);}
  select.mini{width:auto; padding:7px 32px 7px 10px; font-size:14px;}
  .grid{display:grid; gap:18px 20px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); align-items:end;}

  /* ---- Boutons ---- */
  button{font-family:inherit; font-size:14px; font-weight:700; padding:11px 20px; background:var(--green); color:#0B2A08; border:1px solid var(--green-dark); border-radius:3px; cursor:pointer; letter-spacing:.01em;}
  button:hover{background:var(--green-dark); color:#fff;}
  button.outline{background:#fff; color:var(--ink); border:1px solid var(--ink);}
  button.outline:hover, button.outline.active{background:var(--ink); color:#fff;}
  button.secondary{background:none; border:none; color:var(--ink); text-decoration:underline; padding:0; font-weight:500;}
  button.secondary:hover{background:none; color:var(--green-dark);}
  button.small{padding:7px 14px; font-size:13px;}
  button.secondary.small{padding:0;}

  /* ---- Textes d'appoint ---- */
  .note{display:block; font-size:13px; color:var(--muted);}
  .lnk{font-size:13px; font-weight:500; color:var(--ink); cursor:pointer; text-decoration:underline; margin-left:14px;}
  .lnk:hover{color:var(--green-dark);}
  .empty{color:var(--muted); font-size:14px; padding:6px 0;}
  .warn{border-left:4px solid var(--warn); background:#FBECEA; padding:10px 14px; margin:14px 0; font-size:14px;}
  .status{font-size:13px; color:var(--muted); margin-top:14px;}
  .sortie-meta{font-size:14px; color:var(--muted);}
  .subcat-label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 4px;}

  /* ---- Pastilles ---- */
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0;}
  .chip{font-size:12px; font-weight:500; background:#EEF0EA; border:1px solid var(--line); padding:3px 10px; border-radius:999px; color:#222;}
  .chip.strong{background:#fff; border-color:var(--ink); font-weight:600;}
  .chip.todo{background:#FFF4D6; border-color:#D9B44A;}
  .badge{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:4px 10px; border-radius:3px; white-space:nowrap;}
  .badge.prevue{background:var(--green-soft); color:var(--green-dark); border:1px solid var(--green);}
  .badge.faite{background:var(--ink); color:#fff; border:1px solid var(--ink);}
  .badge.annulee{background:#EEE; color:#666; border:1px solid #CCC; text-decoration:line-through;}
  .detail-badges{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0;}

  /* ---- Cartes de sorties / idées ---- */
  .sortie-card, .idea-card{display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--line); border-left:5px solid var(--green); padding:16px 18px; margin-bottom:12px;}
  .sortie-card{cursor:pointer;}
  .sortie-card:hover{border-color:var(--ink); border-left-color:var(--green-dark); box-shadow:0 2px 0 rgba(0,0,0,.1);}
  .sc-date{flex:0 0 68px; text-align:center; background:var(--green-soft); padding:8px 6px;}
  .sc-date.nodate{background:#EEF0EA;}
  .sc-day{font-size:26px; font-weight:700; line-height:1;}
  .sc-mon{font-size:12px; font-weight:700; text-transform:uppercase; color:var(--green-dark);}
  .sc-dur{font-size:11px; color:var(--muted);}
  .sc-body{flex:1; min-width:0;}
  .sc-body h4{font-size:17px;}
  .sc-orga{font-size:13px; color:var(--muted); margin-top:6px;}
  .idea-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .idea-card{align-items:flex-start;}

  /* ---- Inventaire perso ---- */
  .cats{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
  .cat{background:var(--card); border:1px solid var(--line); padding:18px 20px;}
  .cat h4{font-size:16px; padding-bottom:8px; border-bottom:2px solid var(--green); margin-bottom:6px;}
  .item-row{font-size:14px; padding:7px 0; display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid #ECEEE8;}

  /* ---- Détail d'une sortie ---- */
  .participants-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .part-chip{padding:8px 14px; border:1px solid #8E948E; font-size:14px; font-weight:500; cursor:pointer; background:#fff; color:var(--ink); border-radius:999px;}
  .part-chip.present{background:var(--green); border-color:var(--green-dark); font-weight:700; color:#0B2A08;}
  .recap-card{background:var(--card); border:1px solid var(--line); padding:18px 20px; margin-bottom:16px;}
  .recap-card h4{display:flex; justify-content:space-between; align-items:baseline; font-size:17px; padding-bottom:8px; border-bottom:2px solid var(--green); margin-bottom:6px;}
  .collectif-row{display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:14px; padding:8px 0; border-bottom:1px solid #ECEEE8;}
  .repas-day{margin-bottom:16px;}
  .repas-item{font-size:14px; display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid #ECEEE8;}
  .weightbar{display:flex; align-items:baseline; gap:32px; flex-wrap:wrap; background:var(--green-soft); border:1px solid var(--green); padding:18px 22px;}
  .weightbar .big{font-size:36px; font-weight:700; line-height:1.1;}
  .weightbar .label, .weightbar .note{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--green-dark);}

  /* ---- Bilan ---- */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
  .stat{background:var(--card); border:1px solid var(--line); border-top:4px solid var(--green); padding:16px 18px;}
  .stat-n{font-size:32px; font-weight:700; line-height:1.1;}
  .stat-l{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}

  @media (max-width: 600px){
    .top-in{padding:10px 16px;}
    .wrap{padding:4px 16px 56px;}
    .logo{height:48px;}
    h2.page-title{font-size:28px;}
    .tab{padding:10px 12px; font-size:14px;}
    .sortie-card, .idea-card{flex-wrap:wrap; gap:12px;}
    .sc-date{flex:0 0 58px;}
    .top-right{width:100%; justify-content:space-between; gap:8px;}
    .user{font-size:13px;}
    .grid, .cats{grid-template-columns:1fr;}
    .weightbar .big{font-size:28px;}
    .panel{padding:18px;}
  }
</style>
</head>

// Saison de la sortie (4 saisons) -> saison utilisée pour composer le kit (Chaude/Froide)
function saisonEquip(s){
  if(s === 'Chaude' || s === 'Froide') return s;
  return ({'Été':'Chaude','Printemps':'Chaude','Automne':'Froide','Hiver':'Froide'})[s] || 'Froide';
}
function esc(v){ return String(v === undefined || v === null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function opts(list, sel){ return list.map(o => `<option value="${esc(o)}" ${o===sel?'selected':''}>${esc(o)}</option>`).join(''); }
function isBureau(){ const m = membresCache.find(x => x.pseudo === currentUser); return !!m && m.role === 'bureau'; }
function canManage(s){ return isBureau() || (!!s && !!s.organisateur && s.organisateur === currentUser); }
function fmtNum(n){ return (n === '' || n === null || n === undefined) ? '' : Number(n).toLocaleString('fr-FR'); }
let catalogueCache = [];
const MOIS = ['JAN','FÉV','MAR','AVR','MAI','JUN','JUL','AOÛ','SEP','OCT','NOV','DÉC'];
function chips(list){
  const l = list.filter(x => x !== '' && x !== null && x !== undefined);
  return l.length ? '<div class="chips">' + l.map(x => `<span class="chip">${esc(x)}</span>`).join('') + '</div>' : '';
}
function metaChips(s, withDuree){
  return chips([s.type_activite, s.mode_nuitee, s.terrain, s.saison,
    (s.difficulte !== '' && s.difficulte !== undefined) ? 'Difficulté ' + s.difficulte + '/5' : '',
    withDuree && s.duree_jours ? s.duree_jours + ' j' : '',
    (s.distance_km !== '' && s.distance_km !== undefined) ? fmtNum(s.distance_km) + ' km' : '',
    (s.d_plus !== '' && s.d_plus !== undefined) ? 'D+ ' + fmtNum(s.d_plus) + ' m' : '']);
}
function statutBadge(st){
  const k = st || 'prevue';
  return `<span class="badge ${esc(k)}">${({prevue:'Prévue', faite:'Faite', annulee:'Annulée'})[k] || esc(k)}</span>`;
}
function dateBlock(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s.date || s.date_reelle || ''));
  if(!m){
    return s.annee ? `<div class="sc-date nodate"><div class="sc-day" style="font-size:20px;">${esc(s.annee)}</div><div class="sc-mon" style="color:var(--muted)">date à compléter</div></div>`
                   : `<div class="sc-date nodate"><div class="sc-day">—</div><div class="sc-mon" style="color:var(--muted)">date libre</div></div>`;
  }
  return `<div class="sc-date"><div class="sc-day">${Number(m[3])}</div><div class="sc-mon">${MOIS[Number(m[2])-1]}</div>${s.duree_jours ? `<div class="sc-dur">${esc(s.duree_jours)} j</div>` : ''}</div>`;
}
function fmtDateLong(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ''));
  if(!m) return '';
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3])).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

// ================= API =================
async function apiGet(action, params){
  params = params || {};
  const qs = Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const url = `${API_URL}?action=${action}${qs ? '&'+qs : ''}&_ts=${Date.now()}`;
  const res = await fetch(url, {cache:'no-store'});
  const data = await res.json();
  if(data && !Array.isArray(data) && data.error) throw new Error(data.error);
  return data;
}
function showLoadError(id, e){
  const el = document.getElementById(id);
  if(el) el.innerHTML = `<div class="warn">Impossible de charger les données (${esc(e && e.message ? e.message : e)}). Vérifie que le script est redéployé en « Nouvelle version » puis recharge la page (Ctrl+Maj+R).</div>`;
}
async function apiPost(action, body){
  body = body || {};
  try{
    const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, acteur: currentUser, ...body})});
    const data = await res.json();
    if(data && data.error && data.ok === undefined) return {ok:false, error: data.error + ' — le script déployé n\'est probablement pas à jour (Déployer > Gérer les déploiements > Nouvelle version).'};
    return data;
  }catch(e){
    return {ok:false, error:'Enregistrement impossible : ' + e.message};
  }
}

function updateSubcatOptions(){
  const sel = document.getElementById('inv_cat');
  if(!sel) return;
  const cat = sel.value;
  document.getElementById('inv_subcat').innerHTML = SUBCATS[cat].map(s => `<option value="${s}">${s}</option>`).join('');

function catalogFromItems(items){
  const cat = {couchage:{}, vetements:{}, equipements:{}};
  for(const c of Object.keys(SUBCATS)) for(const s of SUBCATS[c]) cat[c][s] = [];
  items.forEach(it => {
    if(cat[it.categorie] && cat[it.categorie][it.sous_categorie]){
      cat[it.categorie][it.sous_categorie].push({nom: it.nom, saison: it.saison, confort: it.confort, poids: Number(it.poids_g)});
    }
  });
  return cat;
}

async function loadInventaire(){
  if(!currentUser || currentView !== 'equipement') return;
  const items = await apiGet('inventaire', {pseudo: currentUser});
  renderInventaireList(items);

function renderInventaireList(items){
  const catalog = catalogFromItems(items);
  const container = document.getElementById('inv_list');
  if(!container) return;
  container.innerHTML = '';
  const labels = {couchage:'Couchage', vetements:'Vêtements', equipements:'Équipements'};
  for(const cat of Object.keys(SUBCATS)){
    const div = document.createElement('div');
    div.className = 'cat';
    let html = `<h4>${labels[cat]}</h4>`;
    for(const sub of SUBCATS[cat]){
      const arr = catalog[cat][sub];
      html += `<div class="subcat-label">${sub}</div>`;
      if(!arr.length) html += `<div class="empty">— vide —</div>`;
      else arr.forEach(it => {
        const nomEsc = it.nom.replace(/'/g,"\\'");
        html += `<div class="item-row"><span>${it.nom} (${it.saison}, ${it.confort}, ${it.poids}g)</span>

      });
    }
    div.innerHTML = html;

  if(!years.includes(cur)) years.unshift(cur);

// ---- moteur (identique aux versions précédentes) ----
function nearestConfort(items, target){
  const order = ['Sommaire','Confortable','Luxe'];
  const ti = order.indexOf(target);
  let best = null, bestDist = 99;
  for(const it of items){ const d = Math.abs(order.indexOf(it.confort) - ti); if(d < bestDist){ bestDist = d; best = it; } }
  return best;
}
function bySaison(items, saison){
  const exact = items.filter(i => i.saison === saison);
  if(exact.length) return exact;
  const multi = items.filter(i => i.saison === 'Multi');
  return multi.length ? multi : items;
}
function lightest(items){ return items.length ? items.reduce((a,b)=> a.poids<=b.poids?a:b) : null; }
function heaviest(items){ return items.length ? items.reduce((a,b)=> a.poids>=b.poids?a:b) : null; }
function pick(sc, saison, confort){ if(!sc||!sc.length) return null; return nearestConfort(bySaison(sc, saison), confort); }
function pickWithIndispensables(sc, saison, confort){
  if(!sc || !sc.length) return [];
  const seasonPool = bySaison(sc, saison);
  const indispensables = seasonPool.filter(i => i.confort === 'Indispensable');
  const normal = seasonPool.filter(i => i.confort !== 'Indispensable');
  const result = [];
  if(normal.length) result.push(nearestConfort(normal, confort));
  const seenNoms = new Set(result.map(r => r.nom));
  indispensables.forEach(i => { if(!seenNoms.has(i.nom)){ result.push(i); seenNoms.add(i.nom); } });
  return result;
}

function computeKit(catalog, params){
  const {nuitee, terrain, saison, confort, duree, difficulte, isCourse, autonomieRepas} = params;
  let individualWeight = 0;
  const sections = {};
  const collectifProposals = [];
  const warnings = [];
  function checkEmpty(l, a){ if(!a || !a.length) warnings.push(l); }

  if(nuitee !== 'Journée'){
    const couchage = [];
    if(nuitee === 'Refuge'){
      const duvetPool = bySaison(catalog.couchage['Duvet']||[], saison);
      const normalDuvet = duvetPool.filter(i => i.confort !== 'Indispensable');
      const indispDuvet = duvetPool.filter(i => i.confort === 'Indispensable');
      const item = lightest(normalDuvet);
      checkEmpty('Duvet', duvetPool);
      if(item){ couchage.push({label:item.nom, poids:item.poids, note:'le plus léger'}); individualWeight += item.poids; }
      indispDuvet.forEach(d => { couchage.push({label:d.nom, poids:d.poids}); individualWeight += d.poids; });
    } else {
      checkEmpty('Tente', catalog.couchage['Tente']);
      checkEmpty('Matelas', catalog.couchage['Matelas']);
      checkEmpty('Duvet', catalog.couchage['Duvet']);
      pickWithIndispensables(catalog.couchage['Tente'], saison, confort).forEach(t => collectifProposals.push({label:t.nom, poids:t.poids, subcat:'Tente'}));
      pickWithIndispensables(catalog.couchage['Matelas'], saison, confort).forEach(m => { couchage.push({label:m.nom, poids:m.poids}); individualWeight += m.poids; });
      pickWithIndispensables(catalog.couchage['Duvet'], saison, confort).forEach(d => { couchage.push({label:d.nom, poids:d.poids}); individualWeight += d.poids; });
      couchage.push({label:'Sac étanche / sursac', poids:150, note:'estimé'}); individualWeight += 150;
    }
    if(confort === 'Luxe'){
      const bonus = pick(catalog.couchage['Bonus'], saison, confort);
      if(bonus){ couchage.push({label:bonus.nom, poids:bonus.poids, note:'bonus'}); individualWeight += bonus.poids; }
    }
    sections['Couchage'] = couchage;
  }

  const vet = [];
  checkEmpty('Couche protectrice', catalog.vetements['Couche protectrice']);
  pickWithIndispensables(catalog.vetements['Couche protectrice'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  checkEmpty('Couche isolante', catalog.vetements['Couche isolante']);
  pickWithIndispensables(catalog.vetements['Couche isolante'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  if(saison === 'Froide'){
    bySaison(catalog.vetements['Sous-couche chaude']||[], saison).forEach(i => { vet.push({label:i.nom, poids:i.poids, note:'base layer'}); individualWeight += i.poids; });
  }
  checkEmpty('Couche transpirante', catalog.vetements['Couche transpirante']);
  pickWithIndispensables(catalog.vetements['Couche transpirante'], saison, confort).forEach((it, idx) => { vet.push({label:it.nom, poids:it.poids, note:(idx===0 && duree>=2)?'+1 rechange conseillé':''}); individualWeight += it.poids; });
  checkEmpty('Pantalons et shorts', catalog.vetements['Pantalons et shorts']);
  pickWithIndispensables(catalog.vetements['Pantalons et shorts'], saison, confort).forEach(it => { vet.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  const extremites = bySaison(catalog.vetements['Extrémités']||[], saison);
  const seen = {};
  extremites.forEach(i => {
    if(seen[i.nom]) return; seen[i.nom] = true;
    const chosen = nearestConfort(extremites.filter(x=>x.nom===i.nom), confort);
    vet.push({label:chosen.nom, poids:chosen.poids}); individualWeight += chosen.poids;
  });
  if(nuitee !== 'Journée' && nuitee !== 'Refuge'){
    vet.push({label:'Vêtement de rechange sec', poids:150, note:'estimé'}); individualWeight += 150;
  }
  sections['Vêtements'] = vet;

  const eq = [];
  const isCourseVal = isCourse;
  if(autonomieRepas){
    checkEmpty('Cuisine', catalog.equipements['Cuisine']);
    const cuisineItems = bySaison(catalog.equipements['Cuisine']||[], saison);
    const seenC = {};
    cuisineItems.forEach(i => {
      if(seenC[i.nom]) return; seenC[i.nom] = true;
      const variants = cuisineItems.filter(x=>x.nom===i.nom);
      collectifProposals.push({label: nearestConfort(variants, confort).nom, poids: nearestConfort(variants, confort).poids, subcat:'Cuisine'});
    });
  }
  checkEmpty('Survie', catalog.equipements['Survie']);
  pickWithIndispensables(catalog.equipements['Survie'], saison, confort).forEach(s => { eq.push({label:s.nom, poids:s.poids}); individualWeight += s.poids; });
  checkEmpty('Hydratation', catalog.equipements['Hydratation']);
  pickWithIndispensables(catalog.equipements['Hydratation'], saison, confort).forEach(hydra => {
    eq.push({label:hydra.nom, poids:hydra.poids}); individualWeight += hydra.poids;
    if(duree >= 2 || saison === 'Chaude'){ eq.push({label:hydra.nom, poids:hydra.poids, note:'unité supplémentaire'}); individualWeight += hydra.poids; }
  });
  checkEmpty('Hygiène et nuit', catalog.equipements['Hygiène et nuit']);
  pickWithIndispensables(catalog.equipements['Hygiène et nuit'], saison, confort).forEach(it => { eq.push({label:it.nom, poids:it.poids}); individualWeight += it.poids; });
  checkEmpty('Sac', catalog.equipements['Sac']);
  const sacPool = bySaison(catalog.equipements['Sac']||[], saison);
  const sac = (isCourseVal || nuitee === 'Journée') ? lightest(sacPool) : heaviest(sacPool);
  if(sac){ eq.push({label:sac.nom, poids:sac.poids}); individualWeight += sac.poids; }
  sections['Équipements'] = eq;

  const nut = [];
  nut.push({label:'Barres énergétiques / fruits secs', poids:150*duree, note:`${duree}j × 150g`}); individualWeight += 150*duree;
  if(isCourse){ nut.push({label:'Gels énergétiques (x4)', poids:160, note:'estimé'}); individualWeight += 160; }
  if(!autonomieRepas && nuitee === 'Journée'){ nut.push({label:'Pique-nique complet', poids:500, note:'estimé'}); individualWeight += 500; }
  if(autonomieRepas){
    nut.push({label:'Repas du soir (lyophilisé)', poids:150*duree, note:`${duree} nuit(s)`}); individualWeight += 150*duree;
    nut.push({label:'Petit-déjeuner', poids:100*duree, note:`${duree}j`}); individualWeight += 100*duree;
  }
  sections['Nutrition'] = nut;

  const divers = [];
  divers.push({label:'Trousse de secours de base', poids:150, note:'estimé'}); individualWeight += 150;
  divers.push({label:'Crème solaire', poids:100, note:'estimé'}); individualWeight += 100;
  const lunPoids = (terrain==='Neige'||terrain==='Glacier') ? 60 : 30;
  divers.push({label:(terrain==='Neige'||terrain==='Glacier')?'Lunettes de glacier (cat.4)':'Lunettes de soleil', poids:lunPoids, note:'estimé'}); individualWeight += lunPoids;
  divers.push({label:'Batterie externe', poids:200, note:'estimé'}); individualWeight += 200;
  sections['Sécurité & divers'] = divers;

  const tech = [];
  function addTech(label, note){
    const poids = TECH_POIDS[label] || 0;
    if(TECH_COLLECTIF.includes(label)){
      collectifProposals.push({label, poids, subcat:'Technique', note:'estimé'});
    } else {
      tech.push({label, poids, note:(note?note+' — ':'')+'estimé'}); individualWeight += poids;
    }
  }
  if(terrain === 'Glacier'){
    addTech('Crampons (paire)'); addTech('Piolet'); addTech('Casque alpi'); addTech('Baudrier');
    addTech("Corde d'encordement (partagée, ~60m/9mm)"); addTech('Broches à glace (kit)');
    if(difficulte >= 4){ addTech('DVA'); addTech('Pelle à neige'); addTech('Sonde avalanche'); }
  } else if(terrain === 'Rocher/Neige technique'){
    addTech('Crampons (paire)'); addTech('Piolet ou bâtons renforcés'); addTech('Casque alpi');
  } else if(terrain === 'Neige'){
    addTech('Raquettes à neige (paire)'); addTech('Bâtons (paire)'); addTech('Guêtres');
    if(difficulte >= 4){ addTech('DVA'); addTech('Pelle à neige'); addTech('Sonde avalanche'); }
  } else if(terrain === 'Route'){
    addTech('Casque vélo'); addTech('Kit de réparation / crevaison');
  } else if(terrain === 'Eau'){
    addTech('Matériel pêche / vêtements étanches');
  }
  if(difficulte >= 4) addTech('GPS (si pas de smartphone fiable)', 'sécurité');
  if(tech.length) sections['Matériel technique'] = tech;

  return { sections, individualWeight, collectifProposals, warnings };
}

async function computeAllKits(){
  const parts = await apiGet('participants', {sortie_id: currentSortieId});
  const present = parts.filter(p => String(p.present) === 'true' || p.present === true).map(p => p.pseudo);
  kitCache = {};
  const params = {
    nuitee: currentSortie.mode_nuitee, terrain: currentSortie.terrain, saison: saisonEquip(currentSortie.saison),
    confort: 'Confortable', duree: Number(currentSortie.duree_jours) || 1, difficulte: Number(currentSortie.difficulte) || 1,
    isCourse: ['Trail','Course à pied'].includes(currentSortie.type_activite),
    autonomieRepas: ['Bivouac','Cabane','Mixte'].includes(currentSortie.mode_nuitee),
  };
  for(const pseudo of present){
    const items = await apiGet('inventaire', {pseudo});
    kitCache[pseudo] = computeKit(catalogFromItems(items), params);
  }
  await renderCollectifAndRecap(present);
}

async function renderCollectifAndRecap(present){
  const bySubcat = {};
  present.forEach(pseudo => {
    (kitCache[pseudo].collectifProposals || []).forEach(p => {
      if(!bySubcat[p.subcat]) bySubcat[p.subcat] = [];
      bySubcat[p.subcat].push(p);
    });
  });
  const groupCollectifItems = [];
  for(const subcat of Object.keys(bySubcat)){
    const uniqueByLabel = {};
    bySubcat[subcat].forEach(p => { if(!uniqueByLabel[p.label] || p.poids < uniqueByLabel[p.label].poids) uniqueByLabel[p.label] = p; });
    Object.values(uniqueByLabel).forEach(p => groupCollectifItems.push(p));
  }

  const existingAttrib = await apiGet('attribution', {sortie_id: currentSortieId});
  const attribMap = {};
  existingAttrib.forEach(a => attribMap[a.objet] = a.pseudo_porteur);

  const container = document.getElementById('collectif-list');
  if(!container) return;
  container.innerHTML = '';
  if(!groupCollectifItems.length){ container.innerHTML = '<div class="empty">Aucun matériel collectif détecté pour cette sortie.</div>'; }
  groupCollectifItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'collectif-row';
    const assigned = attribMap[item.label] || '';
    const options = present.map(p => `<option value="${p}" ${p===assigned?'selected':''}>${p}</option>`).join('');
    row.innerHTML = `<span>${item.label} <span class="note">${item.poids}g${item.note?(' — '+item.note):''}</span></span>
      <select class="mini" onchange="reassign('${item.label.replace(/'/g,"\\'")}', ${item.poids}, this.value)">${options}</select>`;
    container.appendChild(row);
  });

  window._groupCollectifItems = groupCollectifItems;
  renderRecap(present, groupCollectifItems, attribMap);
}

async function reassign(objet, poids, pseudo){
  await apiPost('attribution_set', {sortie_id: currentSortieId, objet, poids_g: poids, pseudo_porteur: pseudo});
  await computeAllKits();
}

async function autoAssign(){
  const items = (window._groupCollectifItems || []).slice().sort((a,b) => b.poids - a.poids);
  const parts = await apiGet('participants', {sortie_id: currentSortieId});
  const present = parts.filter(p => String(p.present) === 'true' || p.present === true).map(p => p.pseudo);
  const running = {};
  present.forEach(p => running[p] = kitCache[p] ? kitCache[p].individualWeight : 0);
  for(const item of items){
    let minP = present[0];
    present.forEach(p => { if(running[p] < running[minP]) minP = p; });
    await apiPost('attribution_set', {sortie_id: currentSortieId, objet: item.label, poids_g: item.poids, pseudo_porteur: minP});
    running[minP] += item.poids;
  }
  await computeAllKits();
}

function renderRecap(present, groupCollectifItems, attribMap){
  const container = document.getElementById('recap-list');
  if(!container) return;
  container.innerHTML = '';
  let grandTotal = 0;
  present.forEach(pseudo => {
    const kit = kitCache[pseudo];
    if(!kit) return;
    const collectifCarried = groupCollectifItems.filter(it => attribMap[it.label] === pseudo);
    const collectifWeight = collectifCarried.reduce((s,i) => s + i.poids, 0);
    const total = kit.individualWeight + collectifWeight;
    grandTotal += total;
    const div = document.createElement('div');
    div.className = 'recap-card';
    let sectionsHtml = Object.entries(kit.sections).map(([name, items]) => {
      if(!items.length) return '';
      return `<div class="subcat-label">${name}</div>` + items.map(i => `<div class="item-row"><span>${i.label}${i.note?` <span class="note">(${i.note})</span>`:''}</span><span>${i.poids}g</span></div>`).join('');
    }).join('');
    const collectifHtml = collectifCarried.length ? `<div class="subcat-label">Matériel collectif porté</div>` +
      collectifCarried.map(i => `<div class="item-row"><span>${i.label}</span><span>${i.poids}g</span></div>`).join('') : '';
    const warnHtml = kit.warnings.length ? `<div class="warn">Inventaire incomplet pour : ${kit.warnings.join(', ')}</div>` : '';
    div.innerHTML = `<h4>${pseudo} <span>${(total/1000).toFixed(2)} kg</span></h4>${sectionsHtml}${collectifHtml}${warnHtml}`;
    container.appendChild(div);
  });
  document.getElementById('detail-weightbar').innerHTML = present.length
    ? `<div><div class="label">Poids total groupe</div><div class="big">${(grandTotal/1000).toFixed(2)} kg</div></div><div class="note">${present.length} participant(s)</div>`
    : '<div class="empty">Aucun participant coché.</div>';
}

// ================= Repas =================
async function refreshRepas(){
  const repas = await apiGet('repas', {sortie_id: currentSortieId});
  const container = document.getElementById('repas-list');
  if(!container) return;
  container.innerHTML = '';
  const byJour = {};
  repas.forEach(r => { (byJour[r.jour] = byJour[r.jour] || []).push(r); });
  Object.keys(byJour).sort((a,b)=>a-b).forEach(jour => {
    const div = document.createElement('div');
    div.className = 'repas-day';
    let html = `<h5>Jour ${jour}</h5>`;
    byJour[jour].forEach(r => {
      html += `<div class="repas-item"><span>${r.moment} — ${r.plat} <span class="note">(${r.responsable}, ${r.portions} pers.)</span></span>
        <span class="lnk" onclick="delRepas(${jour},'${r.moment}','${r.plat.replace(/'/g,"\\'")}','${r.responsable}')">supprimer</span></div>`;
    });
    div.innerHTML = html;
    container.appendChild(div);
  });
  if(!repas.length) container.innerHTML = '<div class="empty">Aucun repas renseigné.</div>';
}
async function addRepas(){
  const body = {
    sortie_id: currentSortieId,
    jour: document.getElementById('r_jour').value,
    moment: document.getElementById('r_moment').value,
    plat: document.getElementById('r_plat').value,
    responsable: document.getElementById('r_resp').value || currentUser,
    portions: document.getElementById('r_portions').value,
  };
  if(!body.plat) return;
  await apiPost('repas_add', body);
  refreshRepas();
}
async function delRepas(jour, moment, plat, responsable){
  await apiPost('repas_delete', {sortie_id: currentSortieId, jour, moment, plat, responsable});
  refreshRepas();
}

boot();
